server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 4m;

  gzip on;
  gzip_types application/javascript application/json text/css image/svg+xml;

  # game server
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /verify/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # the service worker and the start page must always be fresh
  location = /sw.js { add_header Cache-Control "no-cache"; }
  location = /index.html { add_header Cache-Control "no-cache"; }
  location /assets/ { add_header Cache-Control "public, max-age=86400"; }
  location ~ ^/assets/app-.*\.(js|css)$ { add_header Cache-Control "public, max-age=31536000, immutable"; }

  location / { try_files $uri $uri/ =404; }
}
