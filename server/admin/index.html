<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ผู้ดูแล · PROJECT ZERO</title>
<style>
:root{--bg:#061015;--panel:#0e1d24;--panel2:#15272f;--line:#24414b;--fg:#e6f0ee;--muted:#8fa9a6;--accent:#4fd1c5;--good:#5fd39a;--bad:#ff5a4a;--warn:#f2b441}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 "IBM Plex Sans Thai","Segoe UI",system-ui,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line);background:#081419;position:sticky;top:0;z-index:2;flex-wrap:wrap}
header h1{font-size:18px;margin:0;letter-spacing:.04em} header h1 b{color:var(--accent)} .grow{flex:1}
nav{display:flex;gap:6px;flex-wrap:wrap} nav button,.btn{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font:inherit;cursor:pointer}
nav button.on,.btn.pri{background:var(--accent);color:#04201d;border-color:var(--accent);font-weight:600} .btn.bad{background:#3a0d0a;border-color:var(--bad);color:#ffd0ca} .btn:disabled{opacity:.5;cursor:default}
main{max-width:1180px;margin:0 auto;padding:20px} .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px}
h2{font-size:17px;margin:0 0 10px} h3{font-size:14px;margin:14px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
input,select,textarea{background:#08151a;color:var(--fg);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font:inherit} textarea{width:100%;min-height:120px;font-family:ui-monospace,monospace;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px} th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)} th{color:var(--muted);font-weight:600} tr.click{cursor:pointer} tr.click:hover{background:var(--panel2)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0} .muted{color:var(--muted)} .good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)} .mono{font-family:ui-monospace,monospace}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px} .pill{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);font-size:12.5px;margin:2px}
#msg{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--accent);padding:10px 16px;border-radius:12px;display:none;z-index:9}
.login{max-width:380px;margin:60px auto} .login input{width:100%;margin:6px 0}
@media (max-width:700px){ main{padding:12px} th:nth-child(n+5),td:nth-child(n+5){display:none} }
</style>
</head>
<body>
<header><h1>PROJECT <b>ZERO</b> · ผู้ดูแล</h1><span class="grow"></span><nav id="nav"></nav><span id="who" class="muted"></span></header>
<main id="main"></main>
<div id="msg"></div>
<script>
/* Admin page: talks to /api/admin/* with the admin's sign-in. Every change is recorded on the server (admin_log). */
const API = location.pathname.includes("/admin") ? "/api" : (localStorage.getItem("p2050-api") || "/api");
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const tok = () => localStorage.getItem("p2050-at");
function msg(t, bad){ const m = $("#msg"); m.textContent = t; m.style.borderColor = bad ? "var(--bad)" : "var(--accent)"; m.style.display = "block"; clearTimeout(msg.t); msg.t = setTimeout(() => m.style.display = "none", 3500); }
async function api(method, path, body){
  const r = await fetch(API + path, {method, headers:{"Content-Type":"application/json", ...(tok() ? {Authorization:"Bearer " + tok()} : {})}, body:body ? JSON.stringify(body) : undefined});
  if (r.status === 401 && localStorage.getItem("p2050-rt")){
    const rr = await fetch(API + "/auth/refresh", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({refresh:localStorage.getItem("p2050-rt")})});
    if (rr.ok){ const j = await rr.json(); localStorage.setItem("p2050-at", j.access); localStorage.setItem("p2050-rt", j.refresh); return api(method, path, body); }
  }
  let j = null; try { j = await r.json(); } catch {}
  if (!r.ok) throw (j || {error:"http" + r.status});
  return j;
}
const ERR = {not_admin:"บัญชีนี้ไม่ใช่ผู้ดูแล", bad_login:"ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง", banned:"บัญชีถูกระงับ", bad_value:"ค่าไม่ถูกต้อง", cant_ban_self:"ระงับบัญชีตัวเองไม่ได้", cant_demote_self:"ลดสิทธิ์ตัวเองไม่ได้"};
const err = e => ERR[e && e.error] || (e && e.error) || "เกิดข้อผิดพลาด";

let tab = "users";
const TABS = [["users", "ผู้เล่น"], ["config", "ตั้งค่าเกม"], ["ab", "ผลทดสอบ A/B"], ["log", "บันทึกการแก้ไข"]];
function nav(){ $("#nav").innerHTML = TABS.map(([k, l]) => `<button class="${tab === k ? "on" : ""}" data-t="${k}">${l}</button>`).join("") + `<button data-out="1">ออกจากระบบ</button>`; }
$("#nav").onclick = e => { const b = e.target.closest("button"); if (!b) return; if (b.dataset.out){ localStorage.removeItem("p2050-at"); localStorage.removeItem("p2050-rt"); return start(); } tab = b.dataset.t; nav(); show(); };

function loginView(){
  $("#nav").innerHTML = ""; $("#who").textContent = "";
  $("#main").innerHTML = `<div class="card login"><h2>เข้าสู่ระบบผู้ดูแล</h2><p class="muted">ใช้บัญชีเดียวกับในเกม บัญชีต้องได้รับสิทธิ์ผู้ดูแลก่อน (คำสั่ง make-admin บน server)</p>
    <input id="u" placeholder="ชื่อผู้ใช้หรืออีเมล" autocomplete="username"><input id="p" type="password" placeholder="รหัสผ่าน" autocomplete="current-password">
    <button class="btn pri" id="go" style="width:100%">เข้าสู่ระบบ</button></div>`;
  $("#go").onclick = async () => {
    try { const j = await api("POST", "/auth/login", {login:$("#u").value.trim(), password:$("#p").value}); localStorage.setItem("p2050-at", j.access); localStorage.setItem("p2050-rt", j.refresh); start(); }
    catch(e){ msg(err(e), true); }
  };
}
async function start(){
  if (!tok()) return loginView();
  try { const me = await api("GET", "/me"); if (me.user.role !== "admin"){ msg(ERR.not_admin, true); return loginView(); } $("#who").textContent = me.user.displayName + " (@" + me.user.username + ")"; }
  catch(e){ return loginView(); }
  nav(); show();
}
function show(){ ({users:viewUsers, config:viewConfig, ab:viewAB, log:viewLog})[tab](); }

/* ---------------- players ---------------- */
async function viewUsers(q = ""){
  $("#main").innerHTML = `<div class="card"><h2>ผู้เล่น</h2><div class="row"><input id="q" placeholder="ค้นหาชื่อผู้ใช้ อีเมล หรือชื่อที่แสดง" value="${esc(q)}" style="flex:1"><button class="btn pri" id="s">ค้นหา</button></div><div id="list" class="muted">กำลังโหลด…</div></div><div id="detail"></div>`;
  $("#s").onclick = () => viewUsers($("#q").value); $("#q").onkeydown = e => { if (e.key === "Enter") viewUsers($("#q").value); };
  try {
    const j = await api("GET", "/admin/users?q=" + encodeURIComponent(q));
    $("#list").innerHTML = j.rows.length ? `<table><tr><th>ผู้ใช้</th><th>ชื่อ</th><th>เพชร</th><th>ชนะ/เล่น</th><th>สิทธิ์</th><th>เข้าล่าสุด</th></tr>${j.rows.map(u => `<tr class="click" data-id="${u.id}"><td class="mono">@${esc(u.username)}${u.banned ? ' <span class="bad">ระงับ</span>' : ""}</td><td>${esc(u.display_name)}</td><td>${u.gems}</td><td>${u.wins}/${u.games}</td><td>${esc(u.role)}</td><td class="muted">${u.last_login ? new Date(u.last_login).toLocaleString("th-TH") : "—"}</td></tr>`).join("")}</table>` : "ไม่พบผู้เล่น";
    $("#list").onclick = e => { const tr = e.target.closest("tr[data-id]"); if (tr) userDetail(tr.dataset.id); };
  } catch(e){ $("#list").textContent = err(e); }
}
async function userDetail(id){
  const d = $("#detail"); d.innerHTML = `<div class="card muted">กำลังโหลด…</div>`;
  let j; try { j = await api("GET", "/admin/users/" + id); } catch(e){ d.innerHTML = `<div class="card bad">${esc(err(e))}</div>`; return; }
  const u = j.user, f = u.flags || {};
  d.innerHTML = `<div class="card"><h2>@${esc(u.username)} · ${esc(u.display_name)}</h2>
    <p class="muted">${esc(u.email || "")} · สมัคร ${new Date(u.created_at).toLocaleDateString("th-TH")} · การ์ดความรู้ ${u.cards} · เพชร <b class="good">${u.gems}</b></p>
    <div class="grid">
      <div><h3>เพชร</h3><div class="row"><input id="gm" type="number" placeholder="จำนวน (ติดลบ = หัก)" style="width:150px"><input id="gn" placeholder="หมายเหตุ"><button class="btn pri" id="gb">บันทึก</button></div></div>
      <div><h3>สิทธิ์ขอเกียรติบัตร</h3><div class="row"><select id="co"><option value="">ตามกติกาปกติ</option><option value="true">ให้สิทธิ์ทันที</option><option value="false">ไม่ให้สิทธิ์</option></select><button class="btn pri" id="cb">บันทึก</button></div></div>
      <div><h3>กลุ่มทดสอบ A/B</h3><div class="row"><select id="ab"><option value="">สุ่มตามปกติ</option><option>A</option><option>B</option><option>C</option></select><button class="btn pri" id="abb">บันทึก</button></div></div>
      <div><h3>บทบาท</h3><div class="row"><select id="rl"><option value="player">ผู้เล่น</option><option value="tester">ผู้ทดสอบ</option><option value="admin">ผู้ดูแล</option></select><button class="btn pri" id="rb">บันทึก</button></div></div>
      <div><h3>การ์ดความรู้</h3><div class="row"><input id="cd" type="number" value="${u.cards}" style="width:110px"><button class="btn pri" id="cdb">บันทึก</button></div></div>
      <div><h3>ระดับตัวละคร</h3><div class="row"><select id="ch">${j.charsList.map(c => `<option>${c}</option>`).join("")}</select><input id="lv" type="number" min="1" max="${j.levels.length}" placeholder="เลเวล" style="width:90px"><button class="btn pri" id="lvb">ตั้ง</button></div>
        <div class="muted">${Object.entries(j.chars).map(([c, x]) => `${c}: ${x} XP`).join(" · ") || "ยังไม่มี"}</div></div>
    </div>
    <h3>ของที่มี</h3><div>${j.shop.map(k => `<label class="pill"><input type="checkbox" data-it="${k}" ${j.owned.includes(k) ? "checked" : ""}> ${k}</label>`).join("")}</div><div class="row"><button class="btn pri" id="ib">บันทึกของ</button></div>
    <h3>รีเซ็ต</h3><div class="row">${[["results", "ผลการเล่น"], ["achievements", "ความสำเร็จ"], ["chars", "เลเวลตัวละคร"], ["cards", "การ์ดความรู้"], ["saves", "เซฟบนคลาวด์"], ["items", "ของที่ซื้อ"]].map(([k, l]) => `<label class="pill"><input type="checkbox" data-rs="${k}"> ${l}</label>`).join("")}<button class="btn bad" id="rsb">รีเซ็ตที่เลือก</button></div>
    <div class="row"><button class="btn ${u.banned ? "" : "bad"}" id="bn">${u.banned ? "ยกเลิกการระงับบัญชี" : "ระงับบัญชี"}</button></div>
    <h3>เกมล่าสุด</h3><table><tr><th>เริ่ม</th><th>โหมด</th><th>A/B</th><th>ผล</th><th>อุณหภูมิ</th><th>คะแนน</th></tr>${j.runs.map(r => `<tr><td class="muted">${new Date(r.started_at).toLocaleString("th-TH")}</td><td>${r.mode}</td><td>${r.ab || "—"}</td><td class="${r.ending === "win" ? "good" : ""}">${r.ending || "—"}${r.flagged ? ' <span class="bad">ผิดปกติ</span>' : ""}</td><td>${r.temp ?? "—"}</td><td>${r.score ?? "—"}</td></tr>`).join("")}</table>
    <h3>เกียรติบัตร</h3><div>${j.certs.map(c => `<span class="pill">${esc(c.code)} · ${esc(c.full_name)}</span>`).join("") || '<span class="muted">ยังไม่มี</span>'}</div></div>`;
  $("#co").value = f.certOverride === true ? "true" : f.certOverride === false ? "false" : ""; $("#ab").value = f.abGroup || ""; $("#rl").value = u.role;
  const run = async (fn, ok) => { try { await fn(); msg(ok); userDetail(id); } catch(e){ msg(err(e), true); } };
  $("#gb").onclick = () => run(() => api("POST", `/admin/users/${id}/gems`, {amount:Number($("#gm").value), note:$("#gn").value}), "บันทึกเพชรแล้ว");
  $("#cb").onclick = () => run(() => api("POST", `/admin/users/${id}/flags`, {certOverride:$("#co").value === "" ? null : $("#co").value === "true"}), "บันทึกสิทธิ์เกียรติบัตรแล้ว");
  $("#abb").onclick = () => run(() => api("POST", `/admin/users/${id}/flags`, {abGroup:$("#ab").value || null}), "บันทึกกลุ่มทดสอบแล้ว");
  $("#rb").onclick = () => run(() => api("POST", `/admin/users/${id}/flags`, {role:$("#rl").value}), "บันทึกบทบาทแล้ว");
  $("#cdb").onclick = () => run(() => api("POST", `/admin/users/${id}/cards`, {cards:Number($("#cd").value)}), "บันทึกการ์ดแล้ว");
  $("#lvb").onclick = () => run(() => api("POST", `/admin/users/${id}/xp`, {char:$("#ch").value, level:Number($("#lv").value)}), "ตั้งเลเวลแล้ว");
  $("#ib").onclick = () => { const add = [], remove = []; document.querySelectorAll("[data-it]").forEach(c => (c.checked ? add : remove).push(c.dataset.it)); run(() => api("POST", `/admin/users/${id}/items`, {add, remove}), "บันทึกของแล้ว"); };
  $("#rsb").onclick = () => { const what = [...document.querySelectorAll("[data-rs]:checked")].map(c => c.dataset.rs); if (!what.length) return; if (!confirm("รีเซ็ต " + what.join(", ") + " ของผู้เล่นนี้? ย้อนกลับไม่ได้")) return; run(() => api("POST", `/admin/users/${id}/reset`, {what}), "รีเซ็ตแล้ว"); };
  $("#bn").onclick = () => { if (!u.banned && !confirm("ระงับบัญชีนี้?")) return; run(() => api("POST", `/admin/users/${id}/flags`, {banned:!u.banned}), u.banned ? "ยกเลิกการระงับแล้ว" : "ระงับบัญชีแล้ว"); };
}

/* ---------------- online settings ---------------- */
async function viewConfig(pre){
  let j = pre;
  if (!j){ $("#main").innerHTML = `<div class="card muted">กำลังโหลด…</div>`; try { j = await api("GET", "/admin/config"); } catch(e){ $("#main").innerHTML = `<div class="card bad">${esc(err(e))}</div>`; return; } }
  const c = j.config, bal = c.balance || {presets:{A:{}, B:{}}, weights:{A:50, B:50}}, ann = c.announcement || {th:"", en:""};
  const presetRow = (k, p) => `<tr><td class="mono">${k}</td>${["inc", "cost", "haz", "growth"].map(f => `<td><input type="number" step="0.05" min="0.1" max="4" data-p="${k}" data-f="${f}" value="${p[f] ?? 1}" style="width:80px"></td>`).join("")}<td><input type="number" min="0" max="100" data-w="${k}" value="${(bal.weights || {})[k] ?? 0}" style="width:70px"></td></tr>`;
  $("#main").innerHTML = `
  <div class="card"><h2>ค่าความยากสำหรับทดสอบ A/B</h2><p class="muted">inc = รายได้ต่อเดือน · cost = ราคาสกิลและคำสั่ง · haz = ความถี่ภัยพิบัติ · growth = การปล่อย CO₂ โตเร็ว · สัดส่วน = โอกาสที่เกมใหม่จะได้ชุดนี้ (1 = เท่าเดิม)</p>
    <table><tr><th>ชุด</th><th>inc</th><th>cost</th><th>haz</th><th>growth</th><th>สัดส่วน %</th></tr>${Object.entries(bal.presets).map(([k, p]) => presetRow(k, p)).join("")}</table>
    <div class="row"><button class="btn" id="addp">เพิ่มชุด</button><label class="row">บังคับทุกคนใช้ชุด <select id="force"><option value="">ไม่บังคับ</option>${Object.keys(bal.presets).map(k => `<option ${bal.force === k ? "selected" : ""}>${k}</option>`).join("")}</select></label><span class="grow"></span><button class="btn pri" id="sb">บันทึก</button></div></div>
  <div class="card"><h2>ประกาศหน้าเมนู</h2><textarea id="ath" placeholder="ภาษาไทย" style="min-height:60px">${esc(ann.th)}</textarea><textarea id="aen" placeholder="English" style="min-height:60px">${esc(ann.en)}</textarea><div class="row"><span class="grow"></span><button class="btn pri" id="ab2">บันทึก</button></div></div>
  <div class="card"><h2>ปิดเหตุการณ์บางเรื่อง</h2><p class="muted">ใส่รหัสเหตุการณ์คั่นด้วยจุลภาค เช่น EVT_43, NW_REDSEA</p><input id="dis" value="${esc((c.disabledEvents || []).join(", "))}" style="width:100%"><div class="row"><span class="grow"></span><button class="btn pri" id="db">บันทึก</button></div></div>
  <div class="card"><h2>ราคาในร้านค้า (เพชร)</h2><div class="row">${Object.entries(j.shop).map(([k, v]) => `<label class="pill">${k} <input type="number" min="0" data-pr="${k}" value="${(c.prices || {})[k] ?? v.price}" style="width:80px"></label>`).join("")}</div><div class="row"><span class="grow"></span><button class="btn pri" id="pb">บันทึก</button></div></div>
  <div class="card"><h2>เกียรติบัตร</h2><div class="row">จำนวนการ์ดความรู้ที่ต้องมี <input id="cm" type="number" min="0" max="500" value="${c.certMinCards ?? ""}" placeholder="ค่าจาก .env" style="width:110px"><span class="grow"></span><button class="btn pri" id="cmb">บันทึก</button></div></div>`;
  const put = async (key, value, ok) => { try { await api("PUT", "/admin/config/" + key, {value}); msg(ok); } catch(e){ msg(err(e), true); } };
  $("#addp").onclick = () => { const k = String.fromCharCode(65 + Object.keys(bal.presets).length); bal.presets[k] = {inc:1, cost:1, haz:1, growth:1}; bal.weights = {...bal.weights, [k]:0}; viewConfig({...j, config:{...c, balance:bal}}); };
  $("#sb").onclick = () => {
    const presets = {}, weights = {};
    document.querySelectorAll("[data-p]").forEach(i => { (presets[i.dataset.p] = presets[i.dataset.p] || {})[i.dataset.f] = Number(i.value); });
    document.querySelectorAll("[data-w]").forEach(i => { weights[i.dataset.w] = Number(i.value); });
    put("balance", {presets, weights, ...($("#force").value ? {force:$("#force").value} : {})}, "บันทึกค่าความยากแล้ว (มีผลกับเกมที่เริ่มใหม่)");
  };
  $("#ab2").onclick = () => put("announcement", {th:$("#ath").value.trim(), en:$("#aen").value.trim()}, "บันทึกประกาศแล้ว");
  $("#db").onclick = () => put("disabledEvents", $("#dis").value.split(",").map(s => s.trim()).filter(Boolean), "บันทึกแล้ว");
  $("#pb").onclick = () => { const v = {}; document.querySelectorAll("[data-pr]").forEach(i => { v[i.dataset.pr] = Number(i.value); }); put("prices", v, "บันทึกราคาแล้ว"); };
  $("#cmb").onclick = () => put("certMinCards", $("#cm").value === "" ? null : Number($("#cm").value), "บันทึกแล้ว");
}

/* ---------------- A/B results ---------------- */
async function viewAB(){
  $("#main").innerHTML = `<div class="card muted">กำลังโหลด…</div>`;
  let j; try { j = await api("GET", "/admin/stats/ab?days=60"); } catch(e){ $("#main").innerHTML = `<div class="card bad">${esc(err(e))}</div>`; return; }
  const pct = (a, b) => b ? Math.round(a / b * 100) + "%" : "—";
  $("#main").innerHTML = `<div class="card"><h2>ผลทดสอบ A/B (${j.days} วันล่าสุด · ภารกิจ 2050 ระดับปกติ)</h2>
    <p class="muted">เป้าหมาย: ชนะราวครึ่งหนึ่ง คนที่ชนะส่วนใหญ่ได้เกรด A หรือ B และอุณหภูมิตอนชนะไม่ห่างเส้นแพ้มาก · นับเกมของผู้เล่นทุกคนรวม Guest</p>
    <table><tr><th>ชุด</th><th>เกม</th><th>ชนะ</th><th>แพ้</th><th>เลิกกลางคัน</th><th>เกรด S/A/B</th><th>อุณหภูมิตอนชนะ</th><th>เวลาเล่นเฉลี่ย</th><th>เลิกเล่นราวปี</th></tr>
    ${j.rows.map(r => `<tr><td class="mono">${r.ab}</td><td>${r.games}</td><td class="good">${r.wins} (${pct(r.wins, r.wins + r.losses)})</td><td>${r.losses}</td><td>${r.quit}</td><td>${r.grade_s}/${r.grade_a}/${r.grade_b}</td><td>${r.win_temp ?? "—"}°C</td><td>${r.minutes ?? "—"} นาที</td><td>${r.quit_year ?? "—"}</td></tr>`).join("") || '<tr><td colspan="9" class="muted">ยังไม่มีข้อมูล</td></tr>'}</table></div>`;
}
/* ---------------- admin log ---------------- */
async function viewLog(){
  $("#main").innerHTML = `<div class="card muted">กำลังโหลด…</div>`;
  let j; try { j = await api("GET", "/admin/log"); } catch(e){ $("#main").innerHTML = `<div class="card bad">${esc(err(e))}</div>`; return; }
  $("#main").innerHTML = `<div class="card"><h2>บันทึกการแก้ไขของผู้ดูแล</h2><table><tr><th>เวลา</th><th>ผู้ดูแล</th><th>ผู้เล่น</th><th>เรื่อง</th><th>รายละเอียด</th></tr>
    ${j.rows.map(r => `<tr><td class="muted">${new Date(r.created_at).toLocaleString("th-TH")}</td><td>@${esc(r.admin || "—")}</td><td>${r.target ? "@" + esc(r.target) : "—"}</td><td>${esc(r.action)}</td><td class="mono" style="font-size:12px">${esc(JSON.stringify(r.detail))}</td></tr>`).join("")}</table></div>`;
}
start();
</script>
