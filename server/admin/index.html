<style>

@font-face{font-family:"IBM Plex Sans Thai";font-weight:600;font-display:swap;src:url(/assets/fonts/ibm-plex-sans-thai-latin-600.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2122,U+2212}

:root{--bg:#061015;--side:#081419;--panel:#0e1d24;--panel2:#15272f;--line:#24414b;--line2:#1b3139;--fg:#e6f0ee;--muted:#8fa9a6;--dim:#5f7a77;--accent:#4fd1c5;--ink:#04201d;

a{color:var(--accent)} .muted{color:var(--muted)} .dim{color:var(--dim)} .good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)} .gold{color:var(--gold)} .mono{font-family:var(--mono)} .small{font-size:13px} .tiny{font-size:12px}

.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px} .brand img{width:40px;height:40px} .brand b{font:700 18px/1.1 "Chakra Petch",var(--disp);letter-spacing:.04em} .brand b i{font-style:normal;color:var(--accent)} .brand small{display:block;color:var(--muted);font-size:12px;font-weight:400;letter-spacing:0;font-family:var(--body)}

.navb:hover{background:var(--panel);color:var(--fg)} .navb.on{background:rgba(79,209,197,.12);color:var(--accent)}
.navb .cnt:empty{display:none} .navb .cnt{margin-left:auto;font:600 11px var(--mono);background:var(--panel2);border-radius:99px;padding:1px 7px;color:var(--muted)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px} .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}

.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px} .stat span{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px} .stat b{display:block;font:600 28px/1.25 var(--mono);margin-top:6px} .stat small{color:var(--muted)}
.stat .ic{color:var(--accent)}

.btn:hover{border-color:var(--accent)} .btn.pri{background:var(--accent);border-color:var(--accent);color:var(--ink)} .btn.pri:hover{filter:brightness(1.08)}

.search{position:relative;flex:1;min-width:220px} .search .ic{position:absolute;left:13px;top:12px;color:var(--muted)} .search .inp{width:100%;padding-left:40px}

.sw input:checked+i{background:var(--accent)} .sw input:checked+i::after{transform:translateX(20px);background:#fff} .sw input:focus-visible+i{outline:2px solid var(--accent);outline-offset:2px}

.chip.on{border-color:var(--accent);background:rgba(79,209,197,.14);color:var(--accent)} .chip i{font-style:normal;font:600 11px var(--mono);color:var(--muted)}

.badge.admin{color:var(--gold);border-color:rgba(242,193,78,.5)} .badge.tester{color:var(--sky);border-color:rgba(143,208,255,.5)} .badge.ban{color:#ffb3a9;border-color:rgba(255,90,74,.55);background:rgba(255,90,74,.1)} .badge.ok{color:var(--good);border-color:rgba(95,211,154,.5)}
/* tables / lists */
table{width:100%;border-collapse:collapse;font-size:14px} th{font:500 12.5px var(--disp);color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)} td{padding:12px;border-bottom:1px solid var(--line2);vertical-align:middle}
tr.click{cursor:pointer} tr.click:hover td{background:rgba(79,209,197,.05)}
.who{display:flex;align-items:center;gap:12px} .av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:600 15px var(--disp);background:#173039;color:var(--accent);flex:none}
.who b{display:block;font-weight:600} .who small{color:var(--muted);font-family:var(--mono);font-size:12px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.log{display:flex;flex-direction:column} .li{display:grid;grid-template-columns:38px 1fr auto;gap:14px;padding:14px 4px;border-bottom:1px solid var(--line2);align-items:flex-start}
.li .lic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--panel2)} .li .lic .ic{width:19px;height:19px}
.li .t{font-weight:600;line-height:1.5} .li .d{color:var(--muted);font-size:13.5px;margin-top:3px} .li time{color:var(--dim);font-size:12.5px;white-space:nowrap;text-align:right}
.li ul{margin:6px 0 0;padding-left:18px;color:var(--muted);font-size:13.5px} .li li{margin:2px 0}
.ok-c{color:var(--good)} .bad-c{color:#ff8a7e} .acc-c{color:var(--accent)} .gold-c{color:var(--gold)} .sky-c{color:var(--sky)} .pur-c{color:var(--purple)}
/* shop & events */
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.item{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.item .top{display:flex;gap:12px;align-items:flex-start} .item .ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:rgba(79,209,197,.12);color:var(--accent);flex:none} .item .ico .ic{width:22px;height:22px}
.item .ico img{width:44px;height:44px;border-radius:12px;object-fit:cover}
.item b{font:600 15.5px/1.35 var(--disp)} .item p{margin:2px 0 0;color:var(--muted);font-size:13px;line-height:1.5}
.item.changed{border-color:var(--warn)} .item.off{opacity:.55}
.price{display:flex;align-items:center;gap:8px} .price .inp{width:110px;font-family:var(--mono);height:38px}
.evs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.ev{background:var(--panel2);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;transition:opacity .15s,border-color .15s}
.ev .im{height:118px;background:#0b1a20 center/cover;position:relative} .ev .im .tag{position:absolute;left:10px;top:10px}
.ev .bd{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1} .ev b{font:600 14.5px/1.4 var(--disp)} .ev p{margin:0;color:var(--muted);font-size:12.5px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ev .ft{display:flex;align-items:center;gap:10px;margin-top:auto;padding-top:6px} .ev.off{opacity:.5} .ev.off .im{filter:grayscale(1)} .ev.changed{border-color:var(--warn)}
.savebar{position:sticky;bottom:16px;z-index:5;display:flex;align-items:center;gap:12px;background:#0b1d23;border:1px solid var(--warn);border-radius:14px;padding:12px 16px;box-shadow:0 12px 40px rgba(0,0,0,.45);margin-top:18px}
.bars{display:flex;align-items:flex-end;gap:6px;height:140px;padding-top:10px} .bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars i{display:block;width:100%;max-width:34px;border-radius:7px 7px 3px 3px;background:linear-gradient(180deg,var(--accent),#2a8c84);min-height:3px} .bars small{font-size:11px;color:var(--dim)} .bars em{font:600 11px var(--mono);font-style:normal;color:var(--muted)}
/* player page */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);background:none;border:0;cursor:pointer;padding:0;margin-bottom:12px;font:500 14px var(--disp)} .back:hover{color:var(--accent)}
.phead{display:flex;gap:18px;align-items:center;flex-wrap:wrap} .phead .av{width:64px;height:64px;font-size:26px} .phead h1{margin:0;font:600 26px/1.2 var(--disp)}
.chars{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.char{display:flex;gap:12px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px} .char img{width:52px;height:52px;border-radius:50%;object-fit:cover;border:2px solid var(--c)}
.char b{font:600 14.5px var(--disp)} .char .row{gap:6px} .char select{height:34px}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.danger-zone{border-color:rgba(255,90,74,.4)}
.note{background:rgba(242,180,65,.08);border:1px solid rgba(242,180,65,.35);color:#f6d68e;border-radius:12px;padding:10px 14px;font-size:13.5px}
.infobox{background:rgba(79,209,197,.07);border:1px solid rgba(79,209,197,.3);border-radius:12px;padding:12px 14px;font-size:13.5px;color:#bfe9e4}
.infobox ol{margin:6px 0 0;padding-left:20px} .infobox li{margin:3px 0}
.updated{font-size:12px;color:var(--dim)}
/* toast + modal */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;transition:.2s;background:#0f262d;border:1px solid var(--accent);color:var(--fg);padding:12px 18px;border-radius:13px;z-index:50;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.5);pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%)} #toast.bad{border-color:var(--bad)}
.veil{position:fixed;inset:0;background:rgba(2,7,10,.7);display:grid;place-items:center;z-index:40;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px;max-width:460px;width:100%} .modal h3{font:600 19px var(--disp);margin:0 0 8px} .modal p{color:var(--muted);margin:0 0 16px}
/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px} .login .card{max-width:400px;width:100%;padding:30px} .login .brand{justify-content:center;padding:0 0 10px} .login .brand img{width:56px;height:56px} .login .brand b{font-size:22px}
@media (max-width:900px){
  .app{grid-template-columns:1fr} aside{position:sticky;top:0;height:auto;flex-direction:row;overflow-x:auto;padding:10px;gap:4px;z-index:10;border-right:0;border-bottom:1px solid var(--line2)}
  .brand{padding:0 8px 0 0} .brand small,.brand b{display:none} .navb{width:auto;padding:8px 10px;font-size:13.5px} .navb span{display:none} .navb.on span{display:inline} .navb .cnt{display:none} .me{display:none}
  main{padding:18px 14px 60px} .grid2,.grid3{grid-template-columns:1fr} th:nth-child(n+4),td:nth-child(n+4){display:none}
}

<body>
<div id="root"></div>
<div id="toast"></div>
<script>
/* Admin page for Project Zero. Talks to /api/admin/* with the admin's own sign-in; the server checks the admin role on every call
   and writes every change to the admin log. Names, events and icons come from game-data.json (made by web/build.mjs). */
const API = "/api";
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"})[c]);
const ls = {get:k => { try { return localStorage.getItem(k); } catch { return null; } }, set:(k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} }};
let DATA = {icons:{}, events:[], groups:{}, shop:[], chars:[], levels:[], ach:[]};
const ic = (n, cls = "") => `<svg class="ic ${cls}" viewBox="0 0 24 24" aria-hidden="true">${DATA.icons[n] || ""}</svg>`;
const fmt = n => Number(n || 0).toLocaleString("th-TH");
const dt = d => d ? new Date(d).toLocaleString("th-TH", {dateStyle:"medium", timeStyle:"short"}) : "—";
const day = d => d ? new Date(d).toLocaleDateString("th-TH", {dateStyle:"medium"}) : "—";
function ago(d){
  if (!d) return "ยังไม่เคย";
  const s = (Date.now() - new Date(d)) / 1000, r = new Intl.RelativeTimeFormat("th", {numeric:"auto"});
  if (s < 60) return "เมื่อสักครู่"; if (s < 3600) return r.format(-Math.round(s / 60), "minute"); if (s < 86400) return r.format(-Math.round(s / 3600), "hour");
  if (s < 86400 * 30) return r.format(-Math.round(s / 86400), "day"); return day(d);
}
function toast(t, bad){ const m = $("#toast"); m.innerHTML = ic(bad ? "circle-x" : "circle-check", bad ? "bad-c" : "ok-c") + `<span>${esc(t)}</span>`; m.className = "show" + (bad ? " bad" : ""); clearTimeout(toast.t); toast.t = setTimeout(() => m.className = "", 3200); }
function ask(title, text, okLabel = "ยืนยัน", danger = false, typed = ""){
  return new Promise(res => {
    const v = document.createElement("div"); v.className = "veil";
    v.innerHTML = `<div class="modal"><h3>${esc(title)}</h3><p>${text}</p>${typed ? `<div class="field" style="margin-bottom:16px"><span>พิมพ์ <b class="mono">${esc(typed)}</b> เพื่อยืนยัน</span><input class="inp" id="mt"></div>` : ""}
      <div class="row" style="justify-content:flex-end"><button class="btn ghost" data-r="0">ยกเลิก</button><button class="btn ${danger ? "danger" : "pri"}" data-r="1">${esc(okLabel)}</button></div></div>`;
    document.body.appendChild(v);
    const ok = v.querySelector('[data-r="1"]'); if (typed){ ok.disabled = true; v.querySelector("#mt").oninput = e => ok.disabled = e.target.value.trim() !== typed; v.querySelector("#mt").focus(); }
    v.onclick = e => { const b = e.target.closest("[data-r]"); if (e.target === v || b){ v.remove(); res(!!(b && b.dataset.r === "1")); } };
  });
}
async function api(method, path, body, retry = true){
  const r = await fetch(API + path, {method, headers:{"Content-Type":"application/json", ...(ls.get("p2050-at") ? {Authorization:"Bearer " + ls.get("p2050-at")} : {})}, body:body !== undefined ? JSON.stringify(body) : undefined});
  if (r.status === 401 && retry && ls.get("p2050-rt")){
    const rr = await fetch(API + "/auth/refresh", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({refresh:ls.get("p2050-rt")})});
    if (rr.ok){ const j = await rr.json(); ls.set("p2050-at", j.access); ls.set("p2050-rt", j.refresh); return api(method, path, body, false); }
  }
  let j = null; try { j = await r.json(); } catch {}
  if (!r.ok) throw (j || {error:"http" + r.status});
  return j;
}
const ERR = {not_admin:"บัญชีนี้ไม่ใช่ผู้ดูแล", bad_login:"ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง", banned:"บัญชีถูกระงับ", bad_value:"ค่าที่ใส่ไม่ถูกต้อง", bad_amount:"จำนวนเพชรไม่ถูกต้อง",
  cant_ban_self:"ระงับบัญชีตัวเองไม่ได้", cant_demote_self:"ลดสิทธิ์ตัวเองไม่ได้", rate_limited:"ลองบ่อยเกินไป รอสักครู่", not_found:"ไม่พบผู้เล่นนี้"};
const err = e => ERR[e && e.error] || "เกิดข้อผิดพลาด ลองใหม่อีกครั้ง";

function shell(){
  $("#root").innerHTML = `<div class="app"><aside>
      <div class="brand"><img src="/assets/img/ui/logo.png" alt=""><div><b>PROJECT <i>ZERO</i></b><small>หน้าผู้ดูแล</small></div></div>

      <div class="me"><div><b>${esc(ME.displayName)}</b><div class="small muted mono">@${esc(ME.username)}</div></div><button class="btn sm ghost" id="out">${ic("log-out")} ออกจากระบบ</button></div>
    </aside><main id="main"></main></div>`;
  $("aside").onclick = e => { const b = e.target.closest("[data-v]"); if (b) go(b.dataset.v); };
  api("GET", "/admin/settings").then(s => { const n = DATA.events.length; if ($("#evcnt") && n) $("#evcnt").textContent = (n - s.settings.disabledEvents.length) + "/" + n; }).catch(() => {});
  $("#out").onclick = async () => { try { await api("POST", "/auth/logout", {refresh:ls.get("p2050-rt")}); } catch {} ls.set("p2050-at", null); ls.set("p2050-rt", null); boot(); };
}
let ignoreHash = false;
function go(v, arg, fromHash){
  VIEW = v;
  const h = v + (arg ? "/" + arg : "");
  if (!fromHash && location.hash.slice(1) !== h){ ignoreHash = true; location.hash = h; }
  $$(".navb").forEach(b => b.classList.toggle("on", b.dataset.v === v || (v === "player" && b.dataset.v === "users")));
  window.scrollTo(0, 0);
  ({home:viewHome, users:viewUsers, player:viewPlayer, shop:viewShop, events:viewEvents, settings:viewSettings, log:viewLog})[v](arg);
}
const page = (title, sub, extra = "") => `<div class="ph"><div class="grow"><h1>${title}</h1>${sub ? `<p>${sub}</p>` : ""}</div>${extra}</div>`;
const loading = () => { $("#main").innerHTML = `<div class="empty">กำลังโหลด…</div>`; };
const failed = e => { $("#main").innerHTML = `<div class="card"><div class="empty bad">${esc(err(e))}</div></div>`; };

/* ---------- sign in ---------- */
function loginView(note){
  $("#root").innerHTML = `<div class="login"><div class="card"><div class="brand"><img src="/assets/img/ui/logo.png" alt=""><div><b>PROJECT <i>ZERO</i></b><small>หน้าผู้ดูแล</small></div></div>
    <form class="col" id="lf"><label class="field"><span>ชื่อผู้ใช้หรืออีเมล</span><input class="inp" id="u" autocomplete="username" required></label>
    <label class="field"><span>รหัสผ่าน</span><input class="inp" id="p" type="password" autocomplete="current-password" required></label>
    ${note ? `<div class="note">${esc(note)}</div>` : ""}<button class="btn pri" style="height:46px;margin-top:6px">เข้าสู่ระบบ</button></form></div></div>`;
  $("#lf").onsubmit = async e => {
    e.preventDefault();
    try { const j = await api("POST", "/auth/login", {login:$("#u").value.trim(), password:$("#p").value}); ls.set("p2050-at", j.access); ls.set("p2050-rt", j.refresh); boot(); }
    catch(x){ toast(err(x), true); }
  };
}
async function boot(){
  if (!DATA.version){ try { DATA = await (await fetch("game-data.json", {cache:"no-cache"})).json(); } catch {} }
  if (!ls.get("p2050-at") && !ls.get("p2050-rt")) return loginView();
  try { const me = await api("GET", "/me"); if (me.user.role !== "admin") return loginView("บัญชี @" + me.user.username + " ไม่ใช่ผู้ดูแล"); ME = me.user; }
  catch { return loginView(); }
  shell();
  const [v, a] = (location.hash.slice(1) || "home").split("/");
  go(NAV.some(n => n[0] === v) || v === "player" ? v : "home", a ? decodeURIComponent(a) : undefined, true);
}

/* ---------- shop ---------- */
async function viewShop(){
  loading();
  let s; try { s = await api("GET", "/admin/settings"); } catch(e){ return failed(e); }
  const cur = id => s.settings.prices[id] ?? item(id).price, changed = {};
  const draw = () => {
    const n = Object.keys(changed).length;
    $("#main").innerHTML = page("ร้านค้า", "ราคาของที่ผู้เล่นซื้อด้วยเพชร มีผลทันทีโดยไม่ต้องอัปเดตเกม") + `<div class="items">${DATA.shop.map(x => { const v = changed[x.id] ?? cur(x.id); return `<div class="item ${x.id in changed ? "changed" : ""}">
        <div class="top"><div class="ico">${x.kind === "char" ? `<img src="/assets/img/portraits/${x.id.slice(5)}-base.jpg" alt="">` : ic(x.icon in DATA.icons ? x.icon : "gem")}</div><div class="grow"><b>${esc(itemName(x.id))}</b><p>${esc(x.desc || KIND_DESC[x.kind] || "")}</p></div></div>
        <div class="price">${ic("gem", "sky-c")}<input class="inp" type="number" min="0" max="100000" data-p="${x.id}" value="${v}"><span class="muted small">เพชร</span><span class="grow"></span>${v !== x.price ? `<button class="btn sm ghost" data-def="${x.id}" title="ราคาเดิม ${x.price}">${ic("rotate-ccw")} ${x.price}</button>` : `<span class="dim tiny" style="white-space:nowrap">ค่าเริ่มต้น</span>`}</div></div>`; }).join("")}</div>
      ${s.updated.prices ? `<p class="updated" style="margin-top:12px">แก้ล่าสุด ${dt(s.updated.prices.at)} โดย @${esc(s.updated.prices.by || "—")}</p>` : ""}
      ${n ? `<div class="savebar">${ic("info", "warn")}<span class="grow">เปลี่ยนราคา ${n} รายการ ยังไม่ได้บันทึก</span><button class="btn ghost" id="undo">ยกเลิก</button><button class="btn pri" id="save">${ic("save")} บันทึกราคา</button></div>` : ""}`;
    $$("[data-p]").forEach(i => i.onchange = () => { const v = Math.max(0, Math.round(Number(i.value) || 0)); if (v === cur(i.dataset.p)) delete changed[i.dataset.p]; else changed[i.dataset.p] = v; draw(); });
    $$("[data-def]").forEach(b => b.onclick = () => { const k = b.dataset.def; if (item(k).price === cur(k)) delete changed[k]; else changed[k] = item(k).price; draw(); });
    if (n){
      $("#undo").onclick = () => { Object.keys(changed).forEach(k => delete changed[k]); draw(); };
      $("#save").onclick = async () => {
        const all = {...s.settings.prices, ...changed}; DATA.shop.forEach(x => { if (all[x.id] === x.price) delete all[x.id]; });
        try { await api("PUT", "/admin/settings/prices", {value:all}); toast("บันทึกราคาแล้ว"); viewShop(); } catch(e){ toast(err(e), true); }
      };
    }
  };
  draw();
}

/* ---------- events ---------- */
async function viewEvents(){
  loading();
  let s; try { s = await api("GET", "/admin/settings"); } catch(e){ return failed(e); }
  const saved = new Set(s.settings.disabledEvents), off = new Set(saved);
  let q = "", grp = "", onlyOff = false;
  const counts = g => DATA.events.filter(e => !g || e.group === g).length;
  const draw = () => {
    const list = DATA.events.filter(e => (!grp || e.group === grp) && (!onlyOff || off.has(e.id)) && (!q || (e.title + " " + e.desc + " " + e.region).toLowerCase().includes(q.toLowerCase())));
    const diff = [...DATA.events].filter(e => off.has(e.id) !== saved.has(e.id)).length, onN = DATA.events.length - off.size;
    $("#main").innerHTML = page("เหตุการณ์", `เปิดอยู่ <b class="ok-c">${onN}</b> จาก ${DATA.events.length} เรื่อง · เหตุการณ์ที่ปิดจะไม่ขึ้นในเกม (มีผลกับเกมที่เปิดใหม่)`) + `
      <div class="card"><div class="col">
        <div class="row"><label class="search">${ic("search")}<input class="inp" id="q" placeholder="ค้นหาชื่อเหตุการณ์ ภูมิภาค หรือเนื้อหา" value="${esc(q)}"></label>
          <label class="row small" style="gap:8px"><span class="sw"><input type="checkbox" id="oo" ${onlyOff ? "checked" : ""}><i></i></span> แสดงเฉพาะที่ปิด</label></div>
        <div class="chips"><button class="chip ${!grp ? "on" : ""}" data-gr="">ทั้งหมด <i>${counts("")}</i></button>${Object.entries(DATA.groups).map(([k, l]) => `<button class="chip ${grp === k ? "on" : ""}" data-gr="${k}">${l} <i>${counts(k)}</i></button>`).join("")}</div>
        <div class="row"><span class="muted small grow">แสดง ${list.length} เรื่อง</span><button class="btn sm" id="allon">${ic("eye")} เปิดทั้งหมดที่แสดง</button><button class="btn sm" id="alloff">${ic("eye-off")} ปิดทั้งหมดที่แสดง</button></div>
      </div></div>
      <div class="evs">${list.map(e => `<label class="ev ${off.has(e.id) ? "off" : ""} ${off.has(e.id) !== saved.has(e.id) ? "changed" : ""}">
        <div class="im" style="background-image:url(/assets/img/events/${e.id}.webp)"><span class="tag badge">${DATA.groups[e.group] || ""}${e.year ? " · " + e.year : ""}</span></div>
        <div class="bd"><b>${esc(e.title)}</b><p>${esc(e.desc)}</p><div class="ft"><span class="small muted grow">${esc(e.region)}</span><span class="small ${off.has(e.id) ? "muted" : "ok-c"}">${off.has(e.id) ? "ปิด" : "เปิด"}</span><span class="sw"><input type="checkbox" data-ev="${e.id}" ${off.has(e.id) ? "" : "checked"}><i></i></span></div></div></label>`).join("") || `<div class="empty">ไม่พบเหตุการณ์</div>`}</div>
      ${diff ? `<div class="savebar">${ic("info", "warn")}<span class="grow">เปลี่ยน ${diff} เรื่อง ยังไม่ได้บันทึก</span><button class="btn ghost" id="undo">ยกเลิก</button><button class="btn pri" id="save">${ic("save")} บันทึก</button></div>` : ""}`;
    const qi = $("#q"); qi.oninput = () => { q = qi.value; const pos = qi.selectionStart; draw(); const n = $("#q"); n.focus(); n.setSelectionRange(pos, pos); };
    $("#oo").onchange = e => { onlyOff = e.target.checked; draw(); };
    $$("[data-gr]").forEach(b => b.onclick = () => { grp = b.dataset.gr; draw(); });
    $$("[data-ev]").forEach(cb => cb.onchange = () => { cb.checked ? off.delete(cb.dataset.ev) : off.add(cb.dataset.ev); draw(); });
    $("#allon").onclick = () => { list.forEach(e => off.delete(e.id)); draw(); };
    $("#alloff").onclick = () => { if (list.length === DATA.events.length && !confirmAll()) return; list.forEach(e => off.add(e.id)); draw(); };
    if (diff){
      $("#undo").onclick = () => { off.clear(); saved.forEach(x => off.add(x)); draw(); };
      $("#save").onclick = async () => { try { await api("PUT", "/admin/settings/disabledEvents", {value:[...off]}); toast("บันทึกเหตุการณ์แล้ว"); viewEvents(); } catch(e){ toast(err(e), true); } };
    }
  };
  const confirmAll = () => window.confirm("ปิดเหตุการณ์ทุกเรื่อง? เกมจะไม่มีเหตุการณ์ขึ้นเลย");
  draw();
  $("#evcnt") && ($("#evcnt").textContent = (DATA.events.length - saved.size) + "/" + DATA.events.length);
}

      <p class="lead">ปกติไม่ต้องตั้ง (เว็บของเกมเองใช้ได้อยู่แล้ว) ใส่เฉพาะเมื่อเปิดเกมจากโดเมนอื่น เช่น GitHub Pages · บรรทัดละ 1 ที่อยู่</p>
      <textarea class="inp mono" id="eo" placeholder="https://example.github.io" style="width:100%">${esc(st.extraOrigins.join("\n"))}</textarea>
      <div class="row" style="margin-top:12px">${up("extraOrigins")}<span class="grow"></span><button class="btn pri" data-save="extraOrigins">${ic("save")} บันทึก</button></div></div></details>`;
  const VAL = {
    announcement:() => ({th:$("#ath").value.trim(), en:$("#aen").value.trim()}),
    googleClientId:() => $("#gid").value.trim(),
    certMinCards:() => Number($("#cmc").value),
    minGameSeconds:() => Math.round(Number($("#mgs").value) * 60),
    certIssuer:() => $("#ci").value.trim(),
    extraOrigins:() => $("#eo").value.split(/\s+/).map(x => x.trim().replace(/\/$/, "")).filter(Boolean),
  };
  const save = async (k, v, ok = "บันทึกแล้ว") => { try { await api("PUT", "/admin/settings/" + k, {value:v}); toast(ok); viewSettings(); } catch(e){ toast(err(e), true); } };
  $$("[data-save]").forEach(b => b.onclick = async () => {
    const k = b.dataset.save;
    if (k === "certIssuer"){ try { await api("PUT", "/admin/settings/certIssuer", {value:VAL.certIssuer()}); await api("PUT", "/admin/settings/certPartner", {value:$("#cp").value.trim()}); toast("บันทึกแล้ว"); viewSettings(); } catch(e){ toast(err(e), true); } return; }
    save(k, VAL[k](), k === "googleClientId" ? (VAL[k]() ? "เปิดเข้าสู่ระบบด้วย Google แล้ว" : "ปิดเข้าสู่ระบบด้วย Google แล้ว") : "บันทึก" + (SET_NAME[k] ? SET_NAME[k] : "") + "แล้ว");
  });
  $$("[data-reset]").forEach(b => b.onclick = async () => { const k = b.dataset.reset; if (!(await ask("คืนค่าเริ่มต้น?", SET_NAME[k] + " จะกลับเป็นค่าเริ่มต้น", "คืนค่า"))) return; if (k === "certIssuer") await api("PUT", "/admin/settings/certPartner", {value:null}).catch(() => {}); save(k, null, "คืนค่าเริ่มต้นแล้ว"); });
}

/* ---------- log ---------- */
const LOG_TYPE = {gems:["gem", "sky-c", "เพชร"], items:["shopping-bag", "acc-c", "ของในร้าน"], xp:["star", "gold-c", "เลเวลตัวละคร"], cards:["book-open", "acc-c", "การ์ดความรู้"],
  flags:["shield", "pur-c", "สิทธิ์และสถานะ"], reset:["rotate-ccw", "bad-c", "รีเซ็ต"], setting:["settings", "acc-c", "ตั้งค่าเกม"], cert_used:["award", "gold-c", "ประกาศนียบัตร"], config:["settings", "acc-c", "ตั้งค่าเกม (รุ่นเก่า)"]};
const who = (u, n) => u ? `<b>${esc(n || u)}</b> <span class="mono small muted">@${esc(u)}</span>` : "";
function settingText(key, before, after){
  const name = SET_NAME[key] || key, lines = [];
  if (key === "disabledEvents"){
    const b = new Set(before || []), a = new Set(after || []);
    const offd = [...a].filter(x => !b.has(x)), ond = [...b].filter(x => !a.has(x));
    if (offd.length) lines.push(`ปิด ${offd.length} เรื่อง: ${offd.slice(0, 6).map(evName).map(esc).join(", ")}${offd.length > 6 ? " และอื่น ๆ" : ""}`);
    if (ond.length) lines.push(`เปิด ${ond.length} เรื่อง: ${ond.slice(0, 6).map(evName).map(esc).join(", ")}${ond.length > 6 ? " และอื่น ๆ" : ""}`);
    return {title:"แก้เหตุการณ์ในเกม", lines};
  }
  if (key === "prices"){
    const ids = new Set([...Object.keys(before || {}), ...Object.keys(after || {})]);
    ids.forEach(id => { const o = (before || {})[id] ?? item(id).price, n = (after || {})[id] ?? item(id).price; if (o !== n) lines.push(`${esc(itemName(id))}: ${o} → <b>${n}</b> เพชร`); });
    return {title:"เปลี่ยนราคาในร้านค้า", lines};
  }
  if (key === "announcement"){ const t = (after && (after.th || after.en)) || ""; return {title:t ? "แก้ประกาศหน้าเมนู" : "ลบประกาศหน้าเมนู", lines:t ? [`“${esc(t)}”`] : []}; }
  if (key === "googleClientId") return {title:after ? "เปิดเข้าสู่ระบบด้วย Google" : "ปิดเข้าสู่ระบบด้วย Google", lines:after ? [`Client ID ${esc(String(after).slice(0, 18))}…`] : []};
  if (key === "minGameSeconds") return {title:"เปลี่ยนเวลาเล่นขั้นต่ำที่ได้เพชร", lines:[`${Math.round((before || 0) / 60)} → <b>${Math.round((after || 0) / 60)}</b> นาที`]};
  if (key === "certMinCards") return {title:"เปลี่ยนเงื่อนไขประกาศนียบัตร", lines:[`การ์ดความรู้ที่ต้องมี ${before} → <b>${after}</b> ใบ`]};
  if (key === "balance") return {title:"แก้ค่าความยาก A/B (ระบบนี้เลิกใช้แล้ว)", lines:[]};
  if (typeof after === "string" || typeof before === "string") return {title:"เปลี่ยน" + name, lines:[`“${esc(before || "—")}” → “<b>${esc(after || "—")}</b>”`]};
  if (Array.isArray(after)) return {title:"เปลี่ยน" + name, lines:after.map(esc)};
  return {title:"เปลี่ยน" + name, lines:[]};
}
function logItem(r, compact){
  const [icn, col, typeName] = LOG_TYPE[r.action] || ["info", "muted", r.action], d = r.detail || {};
  const target = r.target ? who(r.target, r.target_name) : "";
  let title = "", lines = [];
  if (r.action === "gems"){ title = `${d.amount > 0 ? "ให้เพชร" : "หักเพชร"} <b class="${d.amount > 0 ? "ok-c" : "bad-c"}">${d.amount > 0 ? "+" : ""}${fmt(d.amount)}</b>`; if (d.note) lines.push("เหตุผล: " + esc(d.note)); }
  else if (r.action === "items"){ title = "แก้ของในร้าน"; if ((d.add || []).length) lines.push("ให้: " + d.add.map(itemName).map(esc).join(", ")); if ((d.remove || []).length) lines.push("เอาออก: " + d.remove.map(itemName).map(esc).join(", ")); }
  else if (r.action === "xp"){ title = `ตั้งเลเวล ${esc(charName(d.char))} ${d.from ? `จาก Lv ${d.from} ` : ""}เป็น <b>Lv ${d.level}</b>`; }
  else if (r.action === "cards"){ title = `ตั้งการ์ดความรู้ ${d.from != null ? d.from + " → " : "เป็น "}<b>${d.cards}</b> ใบ`; }
  else if (r.action === "cert_used"){ title = `ใช้สิทธิ์ขอประกาศนียบัตรแล้ว <span class="mono small">${esc(d.code || "")}</span>`; }
  else if (r.action === "reset"){ title = "รีเซ็ตข้อมูล"; lines.push((d.what || []).map(w => RESET[w] || w).join(", ")); }
  else if (r.action === "flags"){
    const c = d.changes;
    if (c){
      title = "แก้สิทธิ์และสถานะ";
      if (c.role) lines.push(`บทบาท: ${ROLE[c.role[0]] || c.role[0]} → <b>${ROLE[c.role[1]] || c.role[1]}</b>`);
      if (c.banned) lines.push(c.banned[1] ? `<span class="bad-c">ระงับบัญชี</span>` : `<span class="ok-c">ยกเลิกการระงับบัญชี</span>`);
      if (c.certOverride) lines.push(`สิทธิ์ประกาศนียบัตร: ${CERT[String(c.certOverride[0])]} → <b>${CERT[String(c.certOverride[1])]}</b>`);
      if (c.note) lines.push(`หมายเหตุ: “${esc(c.note[1] || "—")}”`);
      if (c.banned && Object.keys(c).length === 1) { title = c.banned[1] ? "ระงับบัญชี" : "ยกเลิกการระงับบัญชี"; lines = []; }
    } else { title = "แก้สิทธิ์และสถานะ"; lines.push(`บทบาท ${ROLE[d.role] || d.role || "—"} · ${d.banned ? "ระงับอยู่" : "ใช้งานได้"}${d.flags && "certOverride" in d.flags ? " · สิทธิ์ประกาศนียบัตร: " + CERT[String(d.flags.certOverride)] : ""}`); }
  }
  else if (r.action === "setting" || r.action === "config"){ const x = settingText(d.key, d.before, d.after !== undefined ? d.after : d.value); title = x.title; lines = x.lines; }
  else { title = esc(r.action); }
  return `<div class="li"><div class="lic ${col}">${ic(icn)}</div><div><div class="t">${title}${target && !compact ? ` <span class="muted" style="font-weight:400">${r.action === "gems" || r.action === "items" ? "ให้" : "ของ"}</span> ${target}` : ""}</div>
    ${lines.length ? `<ul>${lines.map(l => `<li>${l}</li>`).join("")}</ul>` : ""}<div class="d">โดย ${r.admin ? `@${esc(r.admin)}` : "ระบบ"} · ${typeName}</div></div>
    <time title="${dt(r.created_at)}">${ago(r.created_at)}</time></div>`;
}
async function viewLog(){
  let action = "", user = "", rows = [], more = false;
  $("#main").innerHTML = page("ประวัติการแก้ไข", "ทุกอย่างที่ผู้ดูแลแก้ ใครแก้ แก้อะไร เมื่อไร") + `<div class="card">
    <div class="row" style="margin-bottom:8px"><label class="search">${ic("search")}<input class="inp" id="lu" placeholder="ชื่อผู้ใช้ของผู้ดูแลหรือผู้เล่น เช่น student1"></label>
      <select class="inp" id="la"><option value="">ทุกเรื่อง</option>${Object.entries(LOG_TYPE).filter(([k]) => k !== "config").map(([k, v]) => `<option value="${k}">${v[2]}</option>`).join("")}</select></div>
    <div class="log" id="ll"><div class="empty">กำลังโหลด…</div></div><div class="row" style="justify-content:center;margin-top:14px" id="lm"></div></div>`;
  const load = async (append) => {
    let j; try { j = await api("GET", `/admin/log?action=${encodeURIComponent(action)}&user=${encodeURIComponent(user)}${append && rows.length ? "&before=" + rows[rows.length - 1].id : ""}`); } catch(e){ $("#ll").innerHTML = `<div class="empty bad">${esc(err(e))}</div>`; return; }
    rows = append ? rows.concat(j.rows) : j.rows; more = j.more;
    $("#ll").innerHTML = rows.map(r => logItem(r)).join("") || `<div class="empty">ไม่พบรายการ</div>`;
    $("#lm").innerHTML = more ? `<button class="btn" id="lmb">โหลดเพิ่ม</button>` : "";
    if (more) $("#lmb").onclick = () => load(true);
  };
  let t; $("#lu").oninput = e => { clearTimeout(t); t = setTimeout(() => { user = e.target.value.trim(); load(false); }, 300); };
  $("#la").onchange = e => { action = e.target.value; load(false); };
  load(false);
}

window.onhashchange = () => {
  if (ignoreHash){ ignoreHash = false; return; }
  if (!ME) return;
  const [v, a] = location.hash.slice(1).split("/");
  go(NAV.some(n => n[0] === v) || v === "player" ? v : "home", a ? decodeURIComponent(a) : undefined, true);
};
boot();
