# Nginx reverse proxy for Project Zero (`npm start`). The game port (WEB_PORT in .env) serves the game,
# /admin/ and forwards /api and /verify to the API, so one upstream is enough.
# Copy to /etc/nginx/sites-available/project-zero, set server_name and the port, enable, then: sudo nginx -t && sudo systemctl reload nginx
# HTTPS: sudo certbot --nginx -d game.example.ac.th
server {
  listen 80;
  server_name game.example.ac.th;           # ← your domain
  client_max_body_size 4m;

  location / {
    proxy_pass http://127.0.0.1:8080;       # ← WEB_PORT
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # optional: send the API straight to API_PORT instead of through the game port
  # location /api/    { proxy_pass http://127.0.0.1:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
  # location /verify/ { proxy_pass http://127.0.0.1:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }

  # optional: keep the admin page to your own network (or put Cloudflare Access in front of /admin/ and /api/admin/)
  # location /admin/ { allow 203.0.113.0/24; deny all; proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; }
}
