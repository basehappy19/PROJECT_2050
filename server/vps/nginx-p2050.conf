# Nginx for Project : 2050 on a VPS without Docker.
# Copy to /etc/nginx/sites-available/p2050, change server_name and APP (the project folder), then:
#   sudo ln -s /etc/nginx/sites-available/p2050 /etc/nginx/sites-enabled/ && sudo nginx -t && sudo systemctl reload nginx
# The project folder also holds source code and server/.env, so only the game files are served (everything else = 404).
server {
  listen 80;
  server_name p2050.example.ac.th;          # ← your domain
  root /opt/project2050;                    # ← same folder again (nginx needs it written out here)
  client_max_body_size 4m;

  gzip on;
  gzip_types application/javascript application/json text/css image/svg+xml;

  # game server (Node.js API on this machine, see p2050-api.service)
  location /api/    { proxy_pass http://127.0.0.1:3000; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
  location /verify/ { proxy_pass http://127.0.0.1:3000; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }

  # admin page
  location /admin/ { alias /opt/project2050/server/admin/; index index.html; add_header Cache-Control "no-cache"; add_header X-Robots-Tag "noindex"; }
  location = /admin { return 301 /admin/; }

  # the game: the start page, the service worker, icons and assets/ only
  location = / { try_files /index.html =404; add_header Cache-Control "no-cache"; }
  location = /index.html { add_header Cache-Control "no-cache"; }
  location = /sw.js { add_header Cache-Control "no-cache"; }
  location ~ ^/(site\.webmanifest|favicon\.svg|apple-touch-icon\.png|icon-(16|32|192|512)\.png|og-image\.png)$ { }
  location ~ ^/assets/app-.*\.(js|css)$ { add_header Cache-Control "public, max-age=31536000, immutable"; }
  location /assets/ { add_header Cache-Control "public, max-age=86400"; }
  location / { return 404; }
}
