<style>
/* Layout: full-viewport 3D globe (Plague Inc. style) with HUD overlays — top bar, KPI column, bottom progress bars + ticker, right command drawer. Single dark look by choice. */
:root{
  color-scheme: dark;
  --bg:#050b10;
  --glass:rgba(10,22,28,.86);
  --panel:#0d1a20;
  --panel-2:#13252c;
  --line:#23404a;
  --fg:#e0ebe8;
  --muted:#8ba6a2;
  --accent:#8fd0ff;
  --accent-ink:#06202e;
  --good:#5fd39a;
  --warn:#f2b441;
  --hot:#f07a3c;
  --bad:#ff5448;
  --f-display:"Chakra Petch","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:10px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
.i{width:1.05em;height:1.05em;vertical-align:-.17em;flex:none;display:inline-block}
.i-leaf,.i-sprout{color:var(--good)} .i-landmark{color:#c3a6ff} .i-users{color:var(--accent)} .i-thermometer{color:var(--hot)}
.i-cloud{color:#b7c7cf} .i-handshake{color:var(--warn)} .i-shield-alert{color:#ff8a7a} .i-siren{color:var(--bad)} .i-newspaper{color:var(--muted)}
.btn .i,.nav .i,.hbtn .i,.seg .i,.x .i{color:inherit}
.hbtn{display:inline-flex;align-items:center;justify-content:center}
.nav button{display:inline-flex;align-items:center;gap:6px}
.mbig .ic .i{width:22px;height:22px;color:var(--accent)} .mbig.primary .ic .i{color:var(--accent-ink)}
.bub .b span .i{width:17px;height:17px}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:14px;line-height:1.5;margin:0}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
#app{position:relative;height:100%;overflow:hidden;
  background:radial-gradient(ellipse at 50% 45%,#0d2230 0%,#050b10 65%)}
#globe{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#globe.drag{cursor:grabbing}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:var(--r)}

/* Top HUD */
.hud-top{position:absolute;top:10px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;gap:8px 12px;flex-wrap:wrap;pointer-events:none;z-index:5}
.hud-top>*{pointer-events:auto}
.brand{padding:6px 12px;display:flex;align-items:baseline;gap:10px}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.05em;margin:0;line-height:1.1}
.brand h1 b{color:var(--accent)}
.brand span{color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.ctrls{display:flex;gap:6px;align-items:center;padding:5px 6px}
.date{font-family:var(--f-display);font-size:18px;font-weight:600;letter-spacing:.03em;padding:0 8px;min-width:96px;text-align:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:transparent;border:0;padding:5px 10px;cursor:pointer;font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}

/* KPI column */
.kpis{position:absolute;left:16px;top:66px;width:196px;display:grid;gap:6px;z-index:4}
.kpi{padding:7px 11px;min-width:0}
.kpi .k{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:19px;font-weight:600;line-height:1.25}
.kpi .s{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.kpi .v.good{color:var(--good)} .kpi .v.warn{color:var(--warn)} .kpi .v.bad{color:var(--bad)}
.meter{height:5px;border-radius:3px;background:var(--panel-2);margin-top:5px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--warn);border-radius:3px;transition:width .3s}
.kpi.danger{border-color:var(--bad)}
.kpi.danger .meter i{background:var(--bad);animation:blink 1s steps(2,start) infinite}
@keyframes blink{50%{opacity:.35}}

/* Globe overlays */
.layer{position:absolute;inset:0;pointer-events:none;z-index:3}
.rlabel{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer;border:1px solid var(--line);background:rgba(5,11,16,.72);border-radius:7px;padding:2px 7px;font-size:11px;white-space:nowrap;transition:opacity .2s}
.rlabel b{font-family:var(--f-mono);font-weight:600}
.rlabel .c{font-family:var(--f-mono);color:var(--hot);margin-left:5px}
.rlabel.sel{border-color:var(--accent);box-shadow:0 0 14px rgba(143,208,255,.5)}
.rlabel.back{opacity:0;pointer-events:none}
.bub{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;border:0;padding:0;background:none;transition:opacity .2s}
.bub .b{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);box-shadow:0 0 16px currentColor;animation:bob 1.4s ease-in-out infinite}
.bub .b span{transform:rotate(45deg);font-size:16px;line-height:1}
.bub.green{color:var(--good)} .bub.green .b{background:#0f3a2a;border:2px solid var(--good)}
.bub.red{color:var(--bad)} .bub.red .b{background:#3d1210;border:2px solid var(--bad)}
.bub.back{opacity:0;pointer-events:none}
.bub .ttl{position:absolute;left:50%;top:38px;transform:translateX(-50%);font-family:var(--f-mono);font-size:10px;color:var(--fg);background:rgba(5,11,16,.8);border-radius:4px;padding:0 4px;white-space:nowrap}
@keyframes bob{50%{margin-top:-4px}}
.float{position:absolute;transform:translate(-50%,-100%);font-family:var(--f-mono);font-weight:600;font-size:14px;pointer-events:none;animation:rise 1.2s ease-out forwards;text-shadow:0 1px 4px #000}
@keyframes rise{to{margin-top:-40px;opacity:0}}
.ghint{position:absolute;left:50%;top:62px;transform:translateX(-50%);font-size:11px;color:var(--muted);z-index:2;pointer-events:none;letter-spacing:.04em;white-space:nowrap}

/* Bottom HUD */
.hud-bot{position:absolute;left:16px;right:16px;bottom:10px;z-index:5;display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.hud-bot>*{min-width:0}
.bars{padding:8px 34px 8px 34px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 56px}
.bar-row{min-width:0}
.bar-row .lab{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);gap:8px}
.bar-row .lab b{font-family:var(--f-mono);color:var(--fg);letter-spacing:0}
.pbar{position:relative;height:12px;border-radius:6px;background:var(--panel-2);overflow:hidden;margin-top:3px}
.pbar i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;transition:width .4s}
.pbar .mk{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--fg);opacity:.5}
#stripes{grid-column:1/-1;width:100%;height:8px;display:block;border-radius:3px}
.meterbox{min-width:0;display:grid;gap:5px}
.mh2{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.mt{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.mv{font-family:var(--f-mono);font-weight:600;font-size:22px;line-height:1}
.mv small{font-size:12px;color:var(--muted);font-weight:400}
.track{position:relative;height:18px;border-radius:9px;background:var(--panel-2);overflow:visible}
.track .fill{position:absolute;left:0;top:0;bottom:0;border-radius:9px;background:linear-gradient(90deg,#1f9e78 0%,#d9a62b 30%,#e0612f 60%,#e0302a 100%);background-size:calc(100% * 50 / 50) 100%;transition:width .5s}
.track.nz{background:linear-gradient(90deg,rgba(255,84,72,.16),rgba(217,166,43,.14),rgba(95,211,154,.16))}
.track.nz .fill{width:100%;background:linear-gradient(90deg,#e0302a 0%,#e0612f 35%,#d9a62b 65%,#1f9e78 100%);transition:clip-path .5s}
.track.nz .goal{left:auto;right:-4px;margin-left:0;margin-right:-20px}
.track .ghost{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--fg);opacity:.45}
.track .mark{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;transform:translate(-50%,-50%);border:3px solid var(--bg);box-shadow:0 0 0 2px currentColor,0 0 12px currentColor;background:currentColor;transition:left .5s}
.track .goal,.track .lose{position:absolute;top:50%;transform:translateY(-50%);display:flex;z-index:2}
.track .goal{left:-4px;margin-left:-18px;color:var(--good)}
.track .lose{right:-4px;margin-right:-20px;color:var(--bad)}
.track .zone{position:absolute;top:0;bottom:0}
.track .zone:first-of-type{border-radius:9px 0 0 9px} .track .zone:nth-of-type(4){border-radius:0 9px 9px 0}
.track .tick{position:absolute;top:100%;transform:translateX(-50%);font-family:var(--f-mono);font-size:9.5px;color:var(--muted);margin-top:1px}
.track.temp{margin-bottom:9px}
.mf{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.mf b{font-family:var(--f-mono)}
.good{color:var(--good)} .warn{color:var(--warn)} .hot{color:var(--hot)} .bad{color:var(--bad)}
.mark.good{color:var(--good)} .mark.warn{color:var(--warn)} .mark.hot{color:var(--hot)} .mark.bad{color:var(--bad)}
.navrow{display:flex;gap:6px;align-items:stretch}
.ticker{flex:1;min-width:0;padding:7px 12px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ticker .d{font-family:var(--f-mono);color:var(--muted);margin-right:8px;font-size:12px}
.nav{display:flex;gap:6px}
.nav button{cursor:pointer;padding:6px 14px;font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.04em;text-transform:uppercase;border-radius:var(--r);border:1px solid var(--line);background:var(--glass);white-space:nowrap}
.nav button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.nav button .cnt{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--good);color:#04130c;font-family:var(--f-mono);font-size:11px}

/* Drawer */
.drawer{position:absolute;right:16px;top:66px;bottom:196px;width:410px;z-index:6;background:var(--panel);display:flex;flex-direction:column;overflow:hidden}
.drawer-h{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line)}
.drawer-h h2{font-family:var(--f-display);font-size:14px;letter-spacing:.08em;text-transform:uppercase;margin:0;font-weight:600}
.x{cursor:pointer;background:transparent;border:1px solid var(--line);border-radius:7px;width:30px;height:30px;color:var(--muted)}
.pane{padding:12px 14px;overflow-y:auto;flex:1;min-height:0}

/* Tech tree */
.cat{margin-bottom:14px}
.cat h3{font-family:var(--f-display);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;font-weight:600}
.nodes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.node{cursor:pointer;text-align:left;border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:6px 7px;min-width:0}
.node .nid{font-family:var(--f-mono);font-size:11px;font-weight:600}
.node .nn{font-size:11.5px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.node .nc{font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.node.locked{opacity:.42}
.node.ready{border-color:rgba(143,208,255,.55)} .node.ready .nid{color:var(--accent)}
.node.own{background:rgba(95,211,154,.12);border-color:rgba(95,211,154,.5)} .node.own .nid{color:var(--good)}
.node.sel{box-shadow:0 0 0 2px var(--accent)}
.tree{position:relative;margin-top:4px}
.tree > svg{position:absolute;left:0;top:0;overflow:visible}
.edge{fill:none;stroke-width:2}
.edge.own{stroke:var(--good)} .edge.ready{stroke:var(--accent)} .edge.locked{stroke:var(--line);stroke-dasharray:4 4}
.ah.own{fill:var(--good)} .ah.ready{fill:var(--accent)} .ah.locked{fill:var(--line)}
.tnode{position:absolute;display:flex;flex-direction:column;justify-content:space-between;padding:5px 7px;overflow:hidden}
.tnode > span:not(.prog){position:relative;z-index:1}
.tnode .nid .i{width:13px;height:13px;vertical-align:-2px;color:inherit}
.tnode.rolling{border-color:var(--accent);animation:rollGlow 1.6s ease-in-out infinite}
.tnode.rolling .nid,.tnode.rolling .nc{color:var(--accent)}
.tnode .prog{position:absolute;left:0;top:0;bottom:0;z-index:0;transition:width 1s ease;
  background:linear-gradient(90deg,rgba(31,158,120,.55),rgba(143,208,255,.45)),repeating-linear-gradient(45deg,rgba(255,255,255,.08) 0 8px,transparent 8px 16px);
  background-size:100% 100%,32px 32px;animation:rollStripes 1.2s linear infinite}
@keyframes rollStripes{to{background-position:0 0,32px 0}}
@keyframes rollGlow{50%{box-shadow:0 0 0 1px var(--accent),0 0 14px rgba(143,208,255,.45)}}
.tnode.own{background:linear-gradient(90deg,rgba(31,158,120,.45),rgba(95,211,154,.25))}
.tnode .nn{font-size:11px;line-height:1.3}
.node.locked.tnode{opacity:.6}
.drawer.wide{width:580px}
.tnode .nc{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tnode.afford{box-shadow:0 0 0 1px var(--accent),0 0 12px rgba(143,208,255,.35)}
.tnode.sel{box-shadow:0 0 0 2px #fff}
.xreq{font-weight:400;font-size:9.5px;color:var(--warn);border:1px solid rgba(242,180,65,.5);border-radius:4px;padding:0 3px}
.legend-t{font-size:11.5px;line-height:1.6;color:var(--fg);background:var(--panel-2);border-radius:8px;padding:7px 10px;margin:0 0 6px}
.detail{border:1px solid var(--line);border-radius:9px;padding:11px;margin-bottom:14px;background:var(--bg)}
.detail h4{font-family:var(--f-display);font-size:16px;margin:0 0 4px;font-weight:600;text-wrap:balance}
.detail p{margin:4px 0 8px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.pill{font-family:var(--f-mono);font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.good{color:var(--good);border-color:rgba(95,211,154,.4)}
.pill.bad{color:var(--bad);border-color:rgba(255,84,72,.4)}
.pill.acc{color:var(--accent);border-color:rgba(143,208,255,.4)}
.btn{cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:600;border-radius:8px;padding:8px 14px;font-family:var(--f-display);letter-spacing:.03em}
.btn:disabled{cursor:not-allowed;background:transparent;color:var(--muted);border-color:var(--line)}
.btn.ghost{background:transparent;color:var(--accent)}
.warn-t{font-size:12px;color:var(--bad);margin-top:6px;display:block}
.roll{display:grid;gap:6px}
.roll div{display:grid;grid-template-columns:40px minmax(0,1fr) 50px;gap:8px;align-items:center;font-size:12px}
.roll .meter{margin:0} .roll .meter i{background:var(--accent)}
.note{font-size:12px;color:var(--muted);margin:8px 0 0}

/* Region pane */
.rlist{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;margin-bottom:12px}
.rlist button{cursor:pointer;border:1px solid var(--line);background:var(--panel-2);border-radius:7px;padding:5px;font-family:var(--f-mono);font-size:12px;display:flex;justify-content:space-between;gap:4px}
.rlist button i{width:9px;height:9px;border-radius:50%;align-self:center}
.rlist button.on{border-color:var(--accent);color:var(--accent)}
.rstats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-bottom:12px}
.rstats div{background:var(--panel-2);border-radius:8px;padding:7px 10px}
.rstats span{display:block;font-size:10.5px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.rstats b{font-family:var(--f-mono);font-size:16px;font-weight:600}
.acts{display:grid;gap:7px}
.act{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:var(--panel-2)}
.act h5{margin:0;font-size:13.5px;font-weight:600}
.act p{margin:2px 0 0;font-size:12px;color:var(--muted)}

/* Stats pane */
.chart{margin-bottom:14px}
.chart h5{margin:0 0 6px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.chart canvas{width:100%;height:150px;display:block;border-radius:8px;background:var(--bg)}
.shares{display:grid;gap:6px}
.shares div{display:grid;grid-template-columns:48px minmax(0,1fr) 56px;gap:8px;align-items:center;font-size:12px}
.shares .meter{margin:0;height:8px} .shares .meter i{background:var(--hot)}
.log{list-style:none;margin:0;padding:0;font-size:13px}
.log li{padding:5px 0;border-bottom:1px dashed var(--line);display:grid;grid-template-columns:72px minmax(0,1fr);gap:8px}
.log .d{font-family:var(--f-mono);color:var(--muted);font-size:12px}

.intro ul{margin:0 0 14px;padding-left:18px} .intro li{margin-bottom:4px}

.end-stats div{background:var(--panel-2);border-radius:8px;padding:8px 10px}

.end-stats b{font-family:var(--f-mono);font-size:18px}
.score{font-family:var(--f-display);font-size:42px;font-weight:700;color:var(--accent);line-height:1}
.win h3{color:var(--good)} .lose h3{color:var(--bad)}
/* Main menu */
.menu{position:absolute;inset:0;z-index:20;display:flex;align-items:flex-start;padding-block:24px;padding-inline:clamp(16px,7vw,96px);
  background:linear-gradient(90deg,rgba(5,11,16,.94) 0%,rgba(5,11,16,.72) 38%,rgba(5,11,16,0) 70%);overflow-y:auto}

.mbig.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.credit{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:4px}

.menu .vol{margin-bottom:0}
.vrow{display:grid;grid-template-columns:auto 96px minmax(0,1fr) 44px;gap:8px;align-items:center}
.vlab{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.ach.locked{opacity:.62}
.ach-ic{width:44px;height:44px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--panel-2);color:var(--muted);border:1px solid var(--line)}
.ach-ic .i{width:22px;height:22px;color:inherit}

  padding:12px 14px;border-radius:12px;background:linear-gradient(135deg,#16303a,#0b1a20);border:1px solid #f2b441;box-shadow:0 12px 40px rgba(0,0,0,.55);
  transform:translateY(20px);opacity:0;transition:transform .35s ease,opacity .35s ease}

.mfoot{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:12px;color:var(--muted)}

.code{width:100%;min-height:70px;resize:vertical;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px;font-family:var(--f-mono);font-size:11px}

#app.in-menu .hud-top,#app.in-menu .kpis,#app.in-menu .hud-bot,#app.in-menu #labels,#app.in-menu #bubbles,#app.in-menu .ghint,#app.in-menu .drawer{display:none!important}
.nw{color:var(--fg)}
@media (max-width:760px){
  .menu{background:rgba(5,11,16,.8);justify-content:center}
}
.loader{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;
  background:radial-gradient(ellipse at 50% 40%,#0f2a3a 0%,#050b10 70%)}
.ld-card{width:min(440px,100%);display:grid;gap:14px;text-align:center}

@media (max-width:900px){

}

/* The first 52 events were written for a richer economy: halve their Eco-Point and political costs/gains,
   then attach sound, fact and the optional third choice. */
(function mergeEvents(){
  const scale = fx => {
    const f = {...fx};
    ["ep","pc"].forEach(k => { if (f[k]) f[k] = Math.round(f[k] * 0.5); });
    if (f.delay) f.delay = {...f.delay, fx:scale(f.delay.fx)};
    return f;
  };
  EVENTS.forEach(e => {
    e.options = e.options.map(o => ({...o, fx:scale(o.fx)}));
    const m = OLD_META[e.id];
    if (m){ e.snd = m.snd; e.fact = m.fact; if (m.fx) Object.entries(m.fx).forEach(([i, fx]) => { e.options[i] = {...e.options[i], fx}; }); if (m.c) e.options.push(m.c); }
  });
  EVENTS.push(...EVENTS2);
})();

function maybeNews(){
  // Annual report every January
  if (S.tick > 0 && S.tick % 12 === 0){
    const y = 2025 + S.tick / 12, prev = S.hist[Math.max(0, S.hist.length - 13)].net, net = netCO2();
    SFX.play("year"); addLog(`[[chart-line]] ${t("annual")} ${y}: ${t("co2")} ${net.toFixed(1)} Gt (${fmt(net - prev)}) · ΔT +${S.temp.toFixed(2)}°C · ${t("appr")} ${S.appr.toFixed(0)}%`, "tc");
  }
  S.regions.forEach(r => { if (!S.flags["half" + r.id] && r.co2 <= r.co2_0 / 2){ S.flags["half" + r.id] = 1; addLog(`${L(RMETA[r.id].name)} ${t("halved")}`, "gd"); } });
  if (Math.random() > 0.3) return;
  const idx = NEWS.map((n,i) => i).filter(i => !S.newsUsed.includes(i) && (!NEWS[i].c || NEWS[i].c()));
  if (!idx.length) return;
  const i = idx[Math.floor(Math.random() * idx.length)];
  S.newsUsed.push(i); if (S.newsUsed.length > 24) S.newsUsed.shift();
  const reg = REGIONS[Math.floor(Math.random() * REGIONS.length)], cities = CITIES[reg.id];
  const txt = NEWS[i][S.lang].replace("{C}", cities[Math.floor(Math.random() * cities.length)][3]).replace("{R}", L(reg.name)).replace("{Y}", 2025 + Math.floor(S.tick / 12));
  addLog("[[newspaper]] " + txt, "nw"); SFX.play("news");
}

/* ---------------------------- State ---------------------------- */
const TOTAL_TICKS = 300;
const TIP_TO_TEMP = 0.004;   // 1 'tipping %' in the GDD ≈ +0.004 °C
const SPEEDS = [0, 4000, 2000];   // 300 ticks: 15 min at 1×, 7.5 min at 2× (+ time spent on decisions)
const MAX_PROJECTS = 3;
let S;
function newState(lang){
  return {
    lang: lang || "th", speed:1, tick:0,
    temp:1.20, tip:10, ep:25, pc:20, appr:75, buys:[],
    epInc:0, damp:0, sink:0, discAll:1, disc:{}, p3:false,
    owned:{}, rollouts:[], delays:[], stall:0,
    used:[], lastEv:-3, bubbles:[], bubId:0, newsUsed:[], flags:{},
    regions: REGIONS.map(r => ({id:r.id, co2:r.co2, co2_0:r.co2, fossil0:r.fossil, comp:r.comp, compBase:r.comp, vuln:r.vuln, cd:{}, uses:{}})),
    hist:[{net:36, temp:1.2}], log:[],
    sel:"SEA", tab:null, node:"E1", over:null, event:null, started:false,
  };
}

/* ---------------------------- Helpers ---------------------------- */
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const R = id => S.regions.find(r => r.id === id);
const avg = f => S.regions.reduce((s,r) => s + f(r), 0) / S.regions.length;
const grossCO2 = () => S.regions.reduce((s,r) => s + r.co2, 0);
/* Nature sinks weaken as the planet warms; the last tonnes are the hardest to cut. */
const sinkEff = () => clamp(1 - Math.max(0, S.temp - 1.2) * 0.3, 0.5, 1);
const netCO2 = () => grossCO2() - S.sink * sinkEff();
const lastMile = r => 0.2 + 0.8 * clamp(r.co2 / r.co2_0, 0, 1);
const dateStr = (tk = S.tick) => `${MONTHS[S.lang][tk % 12]} ${2026 + Math.floor(tk / 12)}`;
const fmt = (v,d=1) => (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(d);
const pick = (arr, w) => { let s = arr.reduce((a,x) => a + w(x), 0), r = Math.random() * s; for (const x of arr){ r -= w(x); if (r <= 0) return x; } return arr[arr.length-1]; };
function addLog(txt, cls=""){ S.log.unshift({tk:S.tick, txt, cls}); if (S.log.length > 150) S.log.pop(); }

function applyGlobalCO2(delta){
  const g = grossCO2() || 1;
  S.regions.forEach(r => applyRegionCO2(r, delta * (r.co2 / g)));
}
/* Increases land in full; cuts are scaled by compliance and the last-mile factor. */
function applyRegionCO2(r, delta){
  const d = delta < 0 ? delta * (r.comp / 100) * lastMile(r) : delta;
  r.co2 = Math.max(0, r.co2 + d);
}
function changeComp(id, v, permanent){
  (id === "ALL" ? S.regions : [R(id)]).forEach(r => { r.comp = clamp(r.comp + v, 0, 100); if (permanent) r.compBase = clamp(r.compBase + v, 0, 100); });
}
function changeVuln(id, v){ (id === "ALL" ? S.regions : [R(id)]).forEach(r => { r.vuln = clamp(r.vuln + v, 0, 100); }); }

/* ---------------------------- Economy ---------------------------- */
const epGain = () => Math.floor(2 + avg(r => r.comp) * 0.07 + S.appr / 30) + S.epInc;   // harder than GDD (10 + C×0.2 + A/10)
const pcGain = () => Math.floor(1 + avg(r => r.comp) * 0.03);                          // harder than GDD (2 + C×0.05)
/* Rush penalty: each project approved in the last 12 months makes the next one 20% dearer (the council resists rushed programmes). */
const recentBuys = () => (S.buys || []).filter(tk => S.tick - tk < 12).length;
const rushMult = () => 1 + 0.2 * recentBuys();
function nodeCost(n){ const m = (S.disc[n.id] ?? 1) * S.discAll * rushMult(); return {ep: Math.round(n.ep * m), pc: Math.round(n.pc * m)}; }
const busyIds = () => [...new Set(S.rollouts.map(r => r.id))];
const atCapacity = n => n.months > 0 && busyIds().length >= MAX_PROJECTS;
function nodeState(n){ if (S.owned[n.id]) return "own"; return n.req.every(q => S.owned[q]) ? "ready" : "locked"; }
function actionCost(a, r){ const m = Math.pow(1.25, r.uses[a.id] || 0); return {ep: Math.round(a.ep * RESERVE[RMETA[r.id].reserve].m * m), pc: Math.round(a.pc * m)}; }

/* ---------------------------- Player actions ---------------------------- */
function buyNode(id){
  const n = NODE[id]; if (!n || nodeState(n) !== "ready") return;
  const c = nodeCost(n); if (S.ep < c.ep || S.pc < c.pc || atCapacity(n)) return;
  S.ep -= c.ep; S.pc -= c.pc; S.owned[id] = true; (S.buys = S.buys || []).push(S.tick);
  const fx = n.fx;
  const boost = (n.cat === 1 && id !== "E1" && S.owned.E1) ? 1.1 : 1;
  const dacEff = (id === "N4" && !S.owned.E2) ? 0.6 : 1;
  if (fx.appr) S.appr = clamp(S.appr + fx.appr, 0, 100);
  if (fx.compAll) changeComp("ALL", fx.compAll, true);
  if (fx.comp) Object.entries(fx.comp).forEach(([k,v]) => changeComp(k, v, true));
  if (fx.vuln) Object.entries(fx.vuln).forEach(([k,v]) => changeVuln(k, v));
  if (fx.vulnAll) changeVuln("ALL", fx.vulnAll);
  if (fx.epInc) S.epInc += fx.epInc;
  if (fx.damp) S.damp += fx.damp;
  if (fx.tip) S.temp += fx.tip * TIP_TO_TEMP;
  if (fx.p3) S.p3 = true;
  const per = {};
  if (fx.co2){ const g = grossCO2() || 1; S.regions.forEach(r => per[r.id] = (per[r.id]||0) + fx.co2 * boost * r.co2 / g); }
  if (fx.all) RIDS.forEach(k => per[k] = (per[k]||0) + fx.all * boost);
  if (fx.rco2) Object.entries(fx.rco2).forEach(([k,v]) => per[k] = (per[k]||0) + v * boost);
  const months = Math.max(1, n.months);
  if (Object.keys(per).length) S.rollouts.push({id, kind:"co2", left:months, months, per});
  if (fx.sink) S.rollouts.push({id, kind:"sink", left:months, months, amt: fx.sink * dacEff});
  addLog(`${t("logTech")}: ${n.id} ${L(n.name)}`, "tc"); Ach.check();
  SFX.play("buy"); render(); Globe.refresh();
}
function doAction(aid){
  const a = ACTIONS.find(x => x.id === aid), r = R(S.sel);
  if (!a || !r || (r.cd[aid] || 0) > 0) return;
  const c = actionCost(a, r); if (S.ep < c.ep || S.pc < c.pc) return;
  S.ep -= c.ep; S.pc -= c.pc; r.uses[aid] = (r.uses[aid] || 0) + 1; r.cd[aid] = a.cd;
  if (aid === "fund")   r.co2 = Math.max(0, r.co2 - 0.35 * r.comp / 100);
  if (aid === "diplo")  r.comp = clamp(r.comp + 8, 0, 100);
  if (aid === "adapt"){ r.vuln = clamp(r.vuln - 10, 0, 100); S.appr = clamp(S.appr + 1, 0, 100); }
  if (aid === "tariff"){ r.co2 = Math.max(0, r.co2 - 0.8 * r.comp / 100); r.comp = clamp(r.comp - 6, 0, 100); }
  addLog(`${t("logAct")}: ${L(a.name)} → ${L(RMETA[r.id].name)}`, "tc"); Ach.unlock("action1"); SFX.play("action");
  if (!checkEnd()) { render(); Globe.refresh(); }
}
function applyFx(fx, target){
  if (fx.co2){ if (target) applyRegionCO2(R(target), fx.co2); else applyGlobalCO2(fx.co2); }
  if (fx.rco2) Object.entries(fx.rco2).forEach(([k,v]) => applyRegionCO2(R(k), v));
  if (fx.temp) S.temp += fx.temp;
  if (fx.tip)  S.temp += fx.tip * TIP_TO_TEMP;             // tipping effects shown and applied as warming
  if (fx.appr) S.appr = clamp(S.appr + fx.appr, 0, 100);
  if (fx.ep)   S.ep = Math.max(0, S.ep + fx.ep);
  if (fx.pc)   S.pc = Math.max(0, S.pc + fx.pc);
  if (fx.comp) Object.entries(fx.comp).forEach(([k,v]) => changeComp(k === "T" ? (target || "ALL") : k, v, false));
  if (fx.vuln) Object.entries(fx.vuln).forEach(([k,v]) => changeVuln(k === "T" ? (target || "ALL") : k, v));
  if (fx.disc) Object.entries(fx.disc).forEach(([k,v]) => { if (k === "ALL") S.discAll *= (1 - v); else S.disc[k] = (S.disc[k] ?? 1) * (1 - v); });
  S.discAll = Math.max(.5, S.discAll);
  if (fx.damp) S.damp += fx.damp;
  if (fx.stall) S.stall += fx.stall;
  if (fx.delay) S.delays.push({at:S.tick + fx.delay.m, fx:fx.delay.fx, target});
}

/* ---------------------------- Bubbles (Plague Inc-style pickups) ----------------------------
   green: clean-energy opportunity → tap for EP. red: climate disaster → tap to send aid (EP cost) before it expires. */
const RED_COST = 20;
function spawnBubbles(){
  const greens = S.bubbles.filter(b => b.type === "green").length;
  if (greens < 1 && Math.random() < 0.10){
    const reg = pick(S.regions, r => 0.3 + r.comp / 100);
    const city = pick(CITIES[reg.id], c => c[2]);
    S.bubbles.push({id:++S.bubId, type:"green", reg:reg.id, lat:city[0], lon:city[1], ttl:4}); SFX.play("spawnGreen");
  }
  const pRed = 0.025 + Math.max(0, S.temp - 1.2) * 0.08;
  if (S.bubbles.filter(b => b.type === "red").length < 1 && Math.random() < pRed){
    const reg = pick(S.regions, r => r.vuln);
    const city = pick(CITIES[reg.id], c => 1);
    S.bubbles.push({id:++S.bubId, type:"red", reg:reg.id, lat:city[0] + (Math.random()-.5)*4, lon:city[1] + (Math.random()-.5)*4, ttl:6}); SFX.play("spawnRed");
  }
}
function ageBubbles(){
  S.bubbles.forEach(b => {
    b.ttl--;
    if (b.ttl <= 0 && b.type === "red"){
      const r = R(b.reg); S.appr = clamp(S.appr - 1.5, 0, 100); r.vuln = clamp(r.vuln + 2, 0, 100); r.comp = clamp(r.comp - 2, 0, 100);
      SFX.play("miss"); addLog(`${t("redMiss")} ${L(RMETA[b.reg].name)} · ${t("appr")} −1.5% · ${t("vuln")} +2%`, "al");
    }

}
function popBubble(id, x, y){
  const b = S.bubbles.find(q => q.id === id); if (!b || S.over || S.event) return;
  if (b.type === "green"){
    const gain = 2 + Math.round(avg(r => r.comp) / 40);
    S.ep += gain; SFX.play("pop"); Ach.green(); floatText(x, y, `+${gain} ${IC.ep}`, "var(--good)");
  } else {
    if (S.ep < RED_COST) { SFX.play("error"); floatText(x, y, t("cantAfford"), "var(--bad)"); return; }
    const r = R(b.reg); S.ep -= RED_COST; r.comp = clamp(r.comp + 3, 0, 100); r.vuln = clamp(r.vuln - 1, 0, 100); S.appr = clamp(S.appr + 1, 0, 100);
    SFX.play("aid"); Ach.aid(); floatText(x, y, `+1% ${IC.appr}`, "var(--accent)");
    addLog(`${t("redHelp")} ${L(RMETA[b.reg].name)} · ${IC.ep} −${RED_COST} · ${t("compliance")} +3%`, "gd");
  }

}
function floatText(x, y, txt, color){
  const el = document.createElement("div"); el.className = "float"; el.innerHTML = icx(txt);
  el.style.left = x + "px"; el.style.top = y + "px"; el.style.color = color;

/* ---------------------------- Tick Engine ---------------------------- */
function tick(){
  if (S.over || S.event) return;
  S.tick++;
  const prevTemp = S.temp;
  if (S.stall > 0) S.stall--;
  else {
    S.rollouts.forEach(ro => {
      if (ro.kind === "co2") S.regions.forEach(r => { const d = ro.per[r.id]; if (d) r.co2 = Math.max(0, r.co2 + (d / ro.months) * (r.comp / 100) * lastMile(r)); });
      else S.sink += ro.amt / ro.months;
      ro.left--;
      if (ro.left === 0) SFX.play("done"), addLog(`${ro.id} ${L(NODE[ro.id].name)} — ${t("logRollDone")}`, "tc");
    });
    S.rollouts = S.rollouts.filter(ro => ro.left > 0);
  }
  S.delays.filter(d => d.at <= S.tick).forEach(d => applyFx(d.fx, d.target));
  S.delays = S.delays.filter(d => d.at > S.tick);
  // Business-as-usual growth (~2%/yr × remaining fossil share), damped by structural policies
  const damp = Math.min(1.3, S.damp);
  S.regions.forEach(r => {
    const fossil = r.fossil0 * (r.co2 / r.co2_0);
    r.co2 = Math.max(0, r.co2 * (1 + 0.0022 * fossil * (1 - damp)));
    if (S.p3 && r.comp < 70) r.co2 = Math.max(0, r.co2 - 0.3 / 12);
    const target = clamp(r.compBase + (S.appr - 75) * 0.25, 0, 100);
    r.comp = clamp(r.comp + (target - r.comp) * 0.02, 0, 100);
    Object.keys(r.cd).forEach(k => { if (r.cd[k] > 0) r.cd[k]--; });
  });
  // 1. Global CO₂  2. ΔT  3. Resources  4. Tipping
  const net = netCO2();
  S.temp += (net / 36.0) * 0.0035 + (S.tip / 100) * 0.0015;
  S.ep += epGain(); S.pc += pcGain();
  if (S.temp >= 2.5) S.tip += 1.2; else if (S.temp >= 2.0) S.tip += 0.6; else if (S.temp >= 1.5) S.tip += 0.2;
  S.tip = clamp(S.tip, 0, 100);
  if (prevTemp < 1.5 && S.temp >= 1.5) { addLog(t("logTipping"), "al"); SFX.play("warn"); }
  if (prevTemp < 2.0 && S.temp >= 2.0) { addLog(t("logTipping2"), "al"); SFX.play("warn"); }
  const stress = avg(r => r.vuln) / 100 * Math.max(0, S.temp - 1.3) * 0.6;
  S.appr = clamp(S.appr - stress + (60 - S.appr) * 0.004, 0, 100);
  ageBubbles(); spawnBubbles();
  S.hist.push({net, temp:S.temp}); Ach.check();
  if (checkEnd()) return;
  maybeNews();
  if (S.tick % 6 === 0) autosave();
  // 5. Event roll (slowed from the GDD's 15% + ΔT×5%): 8% + ΔT×3%, max 25%, at least 4 months apart
  const p = Math.min(0.25, 0.08 + S.temp * 0.03);
  if (S.tick - S.lastEv >= 4 && Math.random() < p) triggerEvent();
}
function eligible(e){
  const c = e.cond || {}, y = 2026 + Math.floor(S.tick / 12);
  return !S.used.includes(e.id) && (!c.minTemp || S.temp >= c.minTemp) && (!c.minYear || y >= c.minYear) && (!c.req || S.owned[c.req]);
}
function triggerEvent(){
  const pool = EVENTS.filter(eligible); if (!pool.length) return;
  const e = pool[Math.floor(Math.random() * pool.length)];
  S.used.push(e.id); S.lastEv = S.tick; S.event = e.id; SFX.play("event"); SFX.ambience(e.snd);
  if (e.target) Globe.focus(e.target);
  renderEvent();
}
function affordable(fx){ return (!(fx.ep < 0) || S.ep >= -fx.ep) && (!(fx.pc < 0) || S.pc >= -fx.pc); }
function chooseOption(i){
  const e = EVENTS.find(x => x.id === S.event); if (!e) return;
  const opt = i === -1 ? {label:{th:UI.postpone.th,en:UI.postpone.en}, fx:{appr:-6,tip:1}} : e.options[i];
  if (i !== -1 && !affordable(opt.fx)) return;
  applyFx(opt.fx, e.target); SFX.play("choose"); Ach.unlock("event1"); Ach.sawEvent(e.id); if (e.id === "EVT_119" || e.id === "EVT_47") Ach.unlock("chaoPhraya");
  addLog(`${L(e.title)} → ${L(opt.label)} [${fxChips(opt.fx, e.target).map(c => c.txt).join(", ") || "—"}]`, "ev");
  S.event = null; closeModal(); SFX.stopAmb();
  if (!checkEnd()) { render(); Globe.refresh(); loop(); }
}
function checkEnd(){
  let o = null;
  if (netCO2() <= 0) o = "win"; else if (S.temp >= 3.0) o = "l1"; else if (S.appr <= 0) o = "l2"; else if (S.tick >= TOTAL_TICKS) o = "l3";
  if (!o) return false;
  S.over = o; S.event = null; SFX.play(o === "win" ? "win" : "lose"); Ach.check(); render(); Globe.refresh(); renderEnd(); return true;
}
function score(){
  const left = Math.max(0, TOTAL_TICKS - S.tick);
  const base = S.over === "win" ? 5000 + left * 20 : Math.round((36 - netCO2()) * 80);
  return Math.max(0, Math.round(base + Math.max(0, 2.5 - S.temp) * 1500 + S.appr * 15));
}

/* ---------------------------- Effect chips ---------------------------- */
function fxChips(fx, target){
  const c = [], rn = id => id === "ALL" ? (S.lang === "th" ? "ทั้งโลก" : "all") : (id === "T" ? (target || "ALL") : id);
  const push = (txt, good) => c.push({txt, good});
  if (fx.co2) push(`${IC.co2} ${target ? target + " " : ""}${fmt(fx.co2)} Gt`, fx.co2 < 0);
  if (fx.rco2) Object.entries(fx.rco2).forEach(([k,v]) => push(`${IC.co2} ${k} ${fmt(v)} Gt`, v < 0));
  if (fx.temp) push(`${IC.temp} ${fmt(fx.temp,2)}°C`, fx.temp < 0);
  if (fx.ep) push(`${IC.ep} ${fmt(fx.ep,0)}`, fx.ep > 0);
  if (fx.pc) push(`${IC.pc} ${fmt(fx.pc,0)}`, fx.pc > 0);
  if (fx.appr) push(`${IC.appr} ${fmt(fx.appr,0)}%`, fx.appr > 0);
  if (fx.tip) push(`${IC.temp} ${fmt(fx.tip * TIP_TO_TEMP,2)}°C`, fx.tip < 0);
  if (fx.comp) Object.entries(fx.comp).forEach(([k,v]) => push(`${IC.comp} ${rn(k)} ${fmt(v,0)}%`, v > 0));
  if (fx.vuln) Object.entries(fx.vuln).forEach(([k,v]) => push(`${IC.vuln} ${rn(k)} ${fmt(v,0)}%`, v < 0));
  if (fx.disc) Object.entries(fx.disc).forEach(([k,v]) => push(`[[flask-conical]] ${k === "ALL" ? (S.lang==="th"?"ทุกโหนด":"all") : k} ${v >= 0 ? "−" : "+"}${Math.round(Math.abs(v)*100)}%`, v >= 0));
  if (fx.damp) push(`${IC.co2} ${S.lang === "th" ? "โตช้าลง" : "growth ↓"}`, true);
  if (fx.stall) push(`[[flask-conical]] ${S.lang === "th" ? "ชะงัก" : "stall"} ${fx.stall} ${t("months")}`, false);
  if (fx.delay) fxChips(fx.delay.fx, target).forEach(x => push(`${x.txt} (${t("delayed")} ${fx.delay.m} ${t("months")})`, x.good));
  return c;
}
const chipHtml = cs => cs.map(x => `<span class="pill ${x.good ? "good" : "bad"}">${x.txt}</span>`).join("");

/* ---------------------------- Audio (real recordings, preloaded) ----------------------------
   sfx-*  : short interface sounds (Kenney, CC0)      amb-* : event ambiences (Moodist / CC0)
   music-*: background music (Maximiliano Stradex, CC0). See assets/audio/CREDITS.txt */
const AUDIO_BASE = "assets/audio/";
const SFX_NAMES = ["click","open","close","select","speed","pause","buy","action","error","event","choose","pop","aid","miss","spawnGreen","spawnRed","news","year","done","warn","save","start","win","lose"];
const AMB_NAMES = ["heat","factory","construction","harbor","ocean","storm","flood","fire","wind","arctic","crowd","city","siren","forest","birds","bees","lab","office","air","train","farm","underwater","market","explosion"];
const MUSIC = {menu:["music-menu.mp3"], game:["music-game1.mp3","music-game2.mp3"]};
const SFX = (() => {
  const pref = k => { try { return localStorage.getItem(k) !== "0"; } catch(e) { return true; } };
  const save = (k, v) => { try { localStorage.setItem(k, v ? "1" : "0"); } catch(e) {} };
  let on = pref("p2050-sfx"), musicOn = pref("p2050-music"), unlocked = false;
  const lvl = (k, d) => { try { const v = parseFloat(localStorage.getItem(k)); return isNaN(v) ? d : Math.max(0, Math.min(1, v)); } catch(e) { return d; } };
  let lvMusic = lvl("p2050-vol-music", 0.8), lvSfx = lvl("p2050-vol-sfx", 0.8);   // player volume sliders 0..1
  const vSfx = () => VOL.sfx * lvSfx, vAmb = () => VOL.amb * lvSfx, vMus = () => (amb ? VOL.musicDuck : VOL.music) * lvMusic;
  const VOL = {sfx:0.6, amb:0.55, music:0.3, musicDuck:0.12};
  const bank = {sfx:{}, amb:{}, music:{}};
  let amb = null, mus = null, musList = null, musIdx = 0, want = null;
  function load(src){
    return new Promise(res => {
      const a = new Audio(); let done = false;
      const fin = ok => { if (done) return; done = true; res(ok ? a : a); };
      a.preload = "auto";
      a.addEventListener("canplaythrough", () => fin(true), {once:true});
      a.addEventListener("error", () => fin(false), {once:true});
      setTimeout(() => fin(false), 9000);   // iOS may not preload before a tap; don't block the loader
      a.src = src; a.load();
    });
  }
  async function preload(tick){
    const jobs = [
      ...SFX_NAMES.map(n => load(`${AUDIO_BASE}sfx-${n}.mp3`).then(a => { bank.sfx[n] = a; tick(); })),
      ...AMB_NAMES.map(n => load(`${AUDIO_BASE}amb-${n}.mp3`).then(a => { bank.amb[n] = a; tick(); })),
      ...[...MUSIC.menu, ...MUSIC.game].map(f => load(AUDIO_BASE + f).then(a => { bank.music[f] = a; tick(); })),
    ];
    await Promise.all(jobs);
  }
  const count = () => SFX_NAMES.length + AMB_NAMES.length + MUSIC.menu.length + MUSIC.game.length;
  function fade(a, to, ms, then){
    if (!a) return;
    const from = a.volume, t0 = performance.now(), id = (a._fade = (a._fade || 0) + 1);   // newest fade wins
    const step = now => {
      if (a._fade !== id) return;
      const k = Math.min(1, (now - t0) / ms); a.volume = Math.max(0, Math.min(1, from + (to - from) * k));
      if (k < 1) requestAnimationFrame(step); else if (then) then();
    };
    requestAnimationFrame(step);
  }
  function play(n){
    if (!on || !unlocked) return;
    const base = bank.sfx[n]; if (!base) return;
    const a = (base.paused || base.ended) ? base : base.cloneNode();
    a.volume = vSfx(); try { a.currentTime = 0; } catch(e) {}
    a.play().catch(() => {});
  }
  function ambience(n){
    stopAmb(0);
    if (!on || !unlocked || !n || !bank.amb[n]) return;
    amb = bank.amb[n]; try { amb.currentTime = 0; } catch(e) {}
    amb.volume = 0; amb.play().catch(() => {}); fade(amb, vAmb(), 700);
    if (mus) fade(mus, vMus(), 600);
  }
  function stopAmb(ms = 800){
    if (amb){ const a = amb; amb = null; if (ms) fade(a, 0, ms, () => a.pause()); else a.pause(); }
    if (mus && musicOn) fade(mus, vMus(), 900);
  }
  function startTrack(){
    const f = musList[musIdx % musList.length], a = bank.music[f]; if (!a) return;
    mus = a; a.loop = musList.length === 1; try { a.currentTime = 0; } catch(e) {}
    a.volume = 0; a.play().catch(() => {}); fade(a, vMus(), 1500);
    a.onended = () => { musIdx++; startTrack(); };
  }
  function music(which){
    want = which;
    if (!unlocked) return;
    if (musList === MUSIC[which] && mus && !mus.paused) return;
    if (mus){ const old = mus; old.onended = null; fade(old, 0, 800, () => old.pause()); mus = null; }
    musList = MUSIC[which]; musIdx = 0;
    if (musicOn) startTrack();
  }
  return {
    preload, count, play, ambience, stopAmb, music,
    get lvMusic(){ return lvMusic; }, get lvSfx(){ return lvSfx; },
    setLevel(kind, v){
      v = Math.max(0, Math.min(1, v));
      if (kind === "music"){ lvMusic = v; try { localStorage.setItem("p2050-vol-music", v); } catch(e) {} if (mus){ mus._fade = (mus._fade || 0) + 1; mus.volume = vMus(); } }
      else { lvSfx = v; try { localStorage.setItem("p2050-vol-sfx", v); } catch(e) {} if (amb){ amb._fade = (amb._fade || 0) + 1; amb.volume = vAmb(); } }
    },
    unlock(){ if (unlocked) return; unlocked = true; if (want) music(want); },
    get on(){ return on; }, get musicOn(){ return musicOn; },
    toggle(){ on = !on; save("p2050-sfx", on); if (!on) stopAmb(0); else play("click"); },
    toggleMusic(){
      musicOn = !musicOn; save("p2050-music", musicOn);
      if (!musicOn && mus){ const m = mus; fade(m, 0, 400, () => m.pause()); }
      else if (musicOn && musList){ mus = null; startTrack(); }
    },
  };
})();

/* Two outcome meters.

   Warming: scale +1.0 → +3.0 °C with coloured danger zones; marker = now, right end = lose. */
const NZ_MAX = 50;
function renderBars(){
  const net = netCO2(), start = 36, prev = S.hist.length > 12 ? S.hist[S.hist.length - 13].net : start;
  const trend = net - prev;                        // Gt change over the last 12 months
  const monthsLeft = Math.max(0, TOTAL_TICKS - S.tick), yearsLeft = monthsLeft / 12;
  let proj, projCls;

        group.add(s); plumes.push(s);
      }));
      raycaster = new THREE.Raycaster();
      bindInput(cv);
      resize(); window.addEventListener("resize", resize);
      G.ok = true;
      requestAnimationFrame(frame);
    } catch (e) {
      console.warn("Globe disabled:", e);
      const d = document.createElement("div"); d.className = "nogl"; d.id = "nogl"; $("app").appendChild(d);
      G.ok = false;
    }
  }
  function resize(){
    if (!renderer) return;
    const w = $("app").clientWidth, h = $("app").clientHeight;
    renderer.setSize(w, h, false); camera.aspect = w / h;
    // keep the globe fully visible on portrait screens
    G.fit = w < h ? 1 + (h / w - 1) * 0.8 : 1;
    camera.updateProjectionMatrix();
  }
  function bindInput(cv){
    cv.addEventListener("pointerdown", e => {
      cv.setPointerCapture(e.pointerId); G.pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
      if (G.pointers.size === 1) G.drag = {x:e.clientX, y:e.clientY, sx:e.clientX, sy:e.clientY, moved:0};
      else { const p = [...G.pointers.values()]; G.pinch = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y); G.drag = null; }
      G.idle = 0; G.tRotY = G.tRotX = null; cv.classList.add("drag");
    });
    cv.addEventListener("pointermove", e => {
      if (!G.pointers.has(e.pointerId)) return;
      G.pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
      if (G.pointers.size === 2){
        const p = [...G.pointers.values()], d = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
        if (G.pinch) G.zoom = clamp(G.zoom * G.pinch / d, 2.3, 6.5); G.pinch = d; return;
      }
      if (!G.drag) return;
      const dx = e.clientX - G.drag.x, dy = e.clientY - G.drag.y;
      G.drag.x = e.clientX; G.drag.y = e.clientY; G.drag.moved += Math.abs(dx) + Math.abs(dy);
      const k = 0.005 * G.zoom / 4;
      G.rotY += dx * k; G.rotX = clamp(G.rotX + dy * k, -1.25, 1.25);
    });
    const end = e => {
      const wasClick = G.drag && G.drag.moved < 6 && G.pointers.size === 1;
      G.pointers.delete(e.pointerId); cv.classList.remove("drag");
      if (wasClick) pickAt(e.clientX, e.clientY);
      G.drag = null; if (G.pointers.size < 2) G.pinch = 0;
    };
    cv.addEventListener("pointerup", end); cv.addEventListener("pointercancel", end);
    cv.addEventListener("wheel", e => { e.preventDefault(); G.zoom = clamp(G.zoom * (1 + Math.sign(e.deltaY) * 0.08), 2.3, 6.5); G.idle = 0; }, {passive:false});
  }
  function pickAt(cx, cy){
    const rect = $("globe").getBoundingClientRect();
    const v = new THREE.Vector2(((cx - rect.left) / rect.width) * 2 - 1, -((cy - rect.top) / rect.height) * 2 + 1);
    raycaster.setFromCamera(v, camera);
    const hit = raycaster.intersectObject(sphere)[0];
    if (!hit || !hit.uv) return;
    const reg = regionAtUV(hit.uv.x, hit.uv.y);
    if (reg) selectRegion(reg, false);
  }
  function focus(reg){
    if (!G.ok) return;
    const [lat, lon] = RMETA[reg].lab;
    let ty = Math.PI / 2 - (lon + 180) * DEG;
    ty = G.rotY + Math.atan2(Math.sin(ty - G.rotY), Math.cos(ty - G.rotY));   // shortest path
    G.tRotY = ty; G.tRotX = clamp(lat * DEG, -1.1, 1.1); G.idle = 0;
  }
  function project(lat, lon, r = 1.02){
    const v = ll2v(lat, lon, r).applyMatrix4(group.matrixWorld);
    const facing = v.clone().normalize().dot(camera.position.clone().sub(v).normalize());
    const p = v.clone().project(camera);
    const w = $("app").clientWidth, h = $("app").clientHeight;
    return {x:(p.x + 1) / 2 * w, y:(1 - p.y) / 2 * h, front: facing > 0.12};
  }
  function frame(){
    requestAnimationFrame(frame);
    clock += 0.016; G.idle += 0.016;
    if (G.tRotY !== null){ G.rotY += (G.tRotY - G.rotY) * 0.08; G.rotX += (G.tRotX - G.rotX) * 0.08; if (Math.abs(G.tRotY - G.rotY) < 0.002) G.tRotY = G.tRotX = null; }
    else if (!G.drag && G.idle > 4 && S && (UIM.screen === "menu" || (S.speed > 0 && !S.event))) G.rotY += UIM.screen === "menu" ? 0.0010 : 0.00035;
    const offX = (UIM.screen === "menu" && camera.aspect > 1.15) ? 1.05 : 0;
    group.position.x += (offX - group.position.x) * 0.06; atmo.position.x = group.position.x;
    group.rotation.set(G.rotX, G.rotY, 0);
    camera.position.set(0, 0, G.zoom * (G.fit || 1)); camera.lookAt(0, 0, 0);
    group.updateMatrixWorld(); camera.updateMatrixWorld();
    // plumes: size ∝ regional CO₂ share; pulse
    if (S){
      const tot = {}; Object.entries(CITIES).forEach(([k, l]) => tot[k] = l.reduce((s,c) => s + c[2], 0));
      plumes.forEach(p => {
        const r = R(p.userData.reg), amt = r.co2 * p.userData.w / tot[p.userData.reg];
        const wp = p.position.clone().applyMatrix4(group.matrixWorld);
        p.visible = wp.clone().normalize().dot(camera.position.clone().sub(wp).normalize()) > 0.05;
        const s = amt <= 0.02 ? 0 : (0.035 + Math.sqrt(amt) * 0.075) * (1 + 0.18 * Math.sin(clock * 2.4 + p.userData.phase));
        p.scale.set(s, s, 1);
        p.material.color.setRGB(1, clamp(0.55 - r.co2 / r.co2_0 * 0.35, 0.15, 0.7), 0.15);
      });
      const warm = clamp((S.temp - 1.2) / 1.4, 0, 1);
      atmo.material.uniforms.c.value.setRGB(0.37 + warm * 0.6, 0.72 - warm * 0.35, 1 - warm * 0.8);
    }
    renderer.render(scene, camera);
    overlays();
  }
  function overlays(){
    if (!S) return;
    const lab = $("labels");
    S.regions.forEach(r => {
      let el = lab.querySelector(`[data-reg="${r.id}"]`);
      if (!el){ el = document.createElement("button"); el.className = "rlabel"; el.dataset.reg = r.id; lab.appendChild(el); }
      const p = project(RMETA[r.id].lab[0], RMETA[r.id].lab[1], 1.03);
      el.style.left = p.x + "px"; el.style.top = p.y + "px";
      el.classList.toggle("back", !p.front); el.classList.toggle("sel", S.sel === r.id);
    });
    document.querySelectorAll("#bubbles .bub").forEach(el => {
      const b = S.bubbles.find(q => q.id === +el.dataset.bub); if (!b) return;
      const p = project(b.lat, b.lon, 1.02);
      el.style.left = p.x + "px"; el.style.top = p.y + "px"; el.classList.toggle("back", !p.front);
    });
  }
  function labels(){
    document.querySelectorAll("#labels .rlabel").forEach(el => {
      const r = R(el.dataset.reg); if (!r) return;
      el.innerHTML = `<b>${r.id}</b><span class="c">${r.co2.toFixed(1)}</span>`;
      el.title = L(RMETA[r.id].name);

  return { init, refresh(){ if (G.ok) drawTexture(); }, focus, labels, get ok(){ return G.ok; } };
})();

/* ---------------------------- Save / Load ----------------------------
   localStorage key p2050-saves = {auto, s1, s2, s3}; each {meta, S}. Save codes = base64 JSON for moving between devices. */
const SAVE_KEY = "p2050-saves", SLOTS = ["auto","s1","s2","s3"];
const UIM = {screen:"menu", sub:null, paused:false, msg:"", err:false};
function readSaves(){ try { return JSON.parse(localStorage.getItem(SAVE_KEY) || "{}") || {}; } catch(e) { return null; } }
function snapshot(){ const c = JSON.parse(JSON.stringify(S)); c.tab = null; return c; }
function writeSlot(slot){
  const all = readSaves(); if (all === null) return false;
  all[slot] = {meta:{tick:S.tick, temp:S.temp, net:netCO2(), appr:S.appr, at:Date.now()}, S:snapshot()};
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(all)); return true; } catch(e) { return false; }
}
function autosave(){ if (S.started && !S.over) writeSlot("auto"); }
function validSave(o){ return o && Array.isArray(o.regions) && o.regions.length === 6 && typeof o.tick === "number" && Array.isArray(o.hist); }
function loadState(obj){
  if (!validSave(obj)) return false;
  clearTimeout(timer);
  const lang = S.lang;
  S = Object.assign(newState(lang), obj, {lang, started:true, speed:0, tab:null});
  UIM.screen = "game"; UIM.paused = false; UIM.sub = null; renderMenu();
  closeModal(); render(); Globe.refresh(); Globe.focus(S.sel);
  if (S.event) renderEvent(); else if (S.over) renderEnd();
  return true;
}
function exportCode(){ return "P2050:" + btoa(unescape(encodeURIComponent(JSON.stringify(snapshot())))); }
function importCode(txt){
  try { const raw = txt.trim().replace(/^P2050:/, ""); return JSON.parse(decodeURIComponent(escape(atob(raw)))); } catch(e) { return null; }
}
function slotMeta(m){
  if (!m) return `<small>${t("empty")}</small>`;
  const when = new Date(m.at).toLocaleString(S.lang === "th" ? "th-TH" : "en-GB", {dateStyle:"short", timeStyle:"short"});

}

        <button class="btn" data-tut="${last ? "done" : "next"}">${last ? t("tutDone") : t("tutNext") + " [[chevron-right]]"}</button></span></div></div></div>`, "tutm");
  }
  function close(){
    if (i === TUT.length - 1) Ach.unlock("tutorial");
    markSeen(); closeModal();
    if (thenIntro) renderIntro();
    else if (UIM.paused) renderPause();
  }
  return {
    seen,
    open(start = 0, intro = false){ i = start; thenIntro = intro; show(); },
    act(a){ if (a === "next"){ i++; show(); } else if (a === "back"){ i--; show(); } else close(); },
  };
})();

const AchStore = (() => {
  const KEY = "p2050-ach";
  let data = {got:{}, greens:0, aids:0, seen:[]};
  try { data = Object.assign(data, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch(e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch(e) {} };
  return { get data(){ return data; }, save };
})();
const Ach = (() => {
  const queue = []; let showing = false;
  function unlock(id){
    const d = AchStore.data; if (d.got[id]) return;
    const a = ACH.find(x => x.id === id); if (!a) return;
    d.got[id] = Date.now(); AchStore.save(); queue.push(a); next();
  }
  function next(){
    if (showing || !queue.length) return;
    showing = true; const a = queue.shift();
    const el = document.createElement("div"); el.className = "ach-toast";
    el.innerHTML = `<span class="ach-ic got">${I(a.icon)}</span><span><small>${t("achUnlocked")}</small><b>${L(a.t)}</b><em>${L(a.d)}</em></span>`;
    document.body.appendChild(el); SFX.play("done");
    requestAnimationFrame(() => el.classList.add("in"));
    setTimeout(() => { el.classList.remove("in"); setTimeout(() => { el.remove(); showing = false; next(); }, 400); }, 4200);
  }
  const byCat = cat => NODES.filter(n => n.cat === cat).every(n => S.owned[n.id]);
  /* check game-state achievements; call after anything that changes S */
  function check(){
    if (!S || !S.started) return;
    if (Object.keys(S.owned).length) unlock("tech1");
    if (recentBuys() >= 3) unlock("rush");
    if (S.ep >= 300) unlock("rich");
    if (byCat(1)) unlock("branchE"); if (byCat(2)) unlock("branchP"); if (byCat(3)) unlock("branchN");
    if (NODES.every(n => S.owned[n.id])) unlock("allTech");
    if (S.owned.E5 && rollProgress("E5") === null) unlock("fusion");
    if (S.regions.every(r => r.comp >= 85)) unlock("unity");
    if (S.regions.every(r => r.vuln < 35)) unlock("safe");
    if (S.hist.length > 12 && S.hist[S.hist.length - 13].net - netCO2() >= 2) unlock("peak");
    if (netCO2() < 18) unlock("half");
    if (S.tick >= 120) unlock("decade");
    const d = AchStore.data;
    if (d.greens >= 25) unlock("greens"); if (d.aids >= 10) unlock("aids");
    if (d.seen.length >= 25) unlock("read25"); if (d.seen.length >= 100) unlock("read100"); if (d.seen.length >= EVENTS.length) unlock("readAll");
    if (S.over === "win"){
      unlock("win");
      if (S.tick < 240) unlock("winEarly");
      if (S.temp < 1.5) unlock("win15");
      if (S.appr >= 70) unlock("winLoved");
    }
    if (S.over === "l3") unlock("loseTime");
    if (S.over === "l1") unlock("loseHeat");
    if (S.over === "l2") unlock("loseVote");
  }
  function count(){ return ACH.filter(a => AchStore.data.got[a.id]).length; }
  function listHtml(){
    const d = AchStore.data, n = count(), pct = Math.round(n / ACH.length * 100);
    const loc = S.lang === "th" ? "th-TH" : "en-GB";
    return `<div class="ach-sum"><div><b>${n}</b> / ${ACH.length} · ${pct}%</div><div class="meter"><i style="width:${pct}%;background:var(--accent)"></i></div></div>
      <div class="ach-list">` + ACH.map(a => {
        const got = d.got[a.id], secret = a.hidden && !got;
        const p = a.prog && !got ? a.prog() : null;
        return `<div class="ach ${got ? "got" : "locked"}">
          <span class="ach-ic ${got ? "got" : ""}">${I(secret ? "lock" : a.icon)}</span>
          <span class="ach-tx"><b>${secret ? t("achSecret") : L(a.t)}</b><em>${secret ? "???" : L(a.d)}</em>
          ${got ? `<small>${t("achOn")} ${new Date(got).toLocaleDateString(loc, {dateStyle:"medium"})}</small>` : ""}
          ${p ? `<span class="ach-prog"><i style="width:${Math.min(100, p[0] / p[1] * 100)}%"></i></span><small>${Math.min(p[0], p[1])} / ${p[1]}</small>` : ""}</span></div>`;
      }).join("") + `</div>`;
  }
  return {
    unlock, check, count, listHtml,
    green(){ AchStore.data.greens++; AchStore.save(); check(); },
    aid(){ AchStore.data.aids++; AchStore.save(); check(); },
    sawEvent(id){ const s = AchStore.data.seen; if (!s.includes(id)){ s.push(id); AchStore.save(); } check(); },
  };
})();

function menuAction(b){
  const m = b.dataset.m; UIM.msg = ""; UIM.err = false;
  if (m === "new"){ clearTimeout(timer); S = newState(S.lang); UIM.screen = "game"; UIM.sub = null; renderMenu(); render(); Globe.refresh(); if (!Tutorial.seen()) Tutorial.open(0, true); else renderIntro(); return; }
  if (m === "continue"){ const s = readSaves(); if (s && s.auto) loadState(s.auto.S); return; }
  if (m === "loadmenu"){ UIM.sub = "load"; return renderMenu(); }
  if (m === "ach"){ UIM.sub = "ach"; return renderMenu(); }
  if (m === "howto"){ UIM.sub = "howto"; return renderMenu(); }
  if (m === "back"){ UIM.sub = null; return renderMenu(); }
  if (m === "load"){ const s = readSaves(); if (s && s[b.dataset.slot]) loadState(s[b.dataset.slot].S); return; }
  if (m === "import"){
    const o = importCode(($("codeIn") || {}).value || "");
    if (!loadState(o)){ UIM.msg = t("codeBad"); UIM.err = true; renderMenu(); }
    return;
  }
  if (m === "pause"){ if (!S.started || S.over || S.event) return; SFX.play("pause"); UIM.paused = true; UIM.prevSpeed = S.speed; S.speed = 0; render(); loop(); return renderPause(); }
  if (m === "resume"){ UIM.paused = false; closeModal(); S.speed = UIM.prevSpeed || 1; render(); return loop(); }
  if (m === "sfx"){ SFX.toggle(); render(); renderMenu(); if (UIM.paused) renderPause(); return; }
  if (m === "music"){ SFX.toggleMusic(); render(); renderMenu(); if (UIM.paused) renderPause(); return; }
  if (m === "tutorial"){ return Tutorial.open(0, false); }
  if (m === "fs"){
    const p = document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen({navigationUI:"hide"});
    if (p && p.catch) p.catch(() => {});
    return;
  }
  if (m === "save"){ SFX.play("save"); Ach.unlock("saver"); UIM.msg = writeSlot(b.dataset.slot) ? `${t("saved")} · ${slotName(b.dataset.slot)}` : t("noStore"); return renderPause(); }

}

  if (b.dataset.lg || b.dataset.node || b.id === "introLang") SFX.play("click");
  if (b.dataset.close) SFX.play("close");
  if (b.dataset.tab) SFX.play(S.tab === b.dataset.tab ? "close" : "open");
  if (b.dataset.bub) return popBubble(+b.dataset.bub, ev.clientX, ev.clientY);
  if (b.dataset.sp !== undefined) return setSpeed(+b.dataset.sp);
  if (b.dataset.lg) return setLang(b.dataset.lg);
  if (b.dataset.close){ S.tab = null; return render(); }
  if (b.dataset.tab){ S.tab = S.tab === b.dataset.tab ? null : b.dataset.tab; return render(); }
  if (b.dataset.reg) return selectRegion(b.dataset.reg, true);
  if (b.dataset.node){ S.node = b.dataset.node; return render(); }
  if (b.dataset.buy) return buyNode(b.dataset.buy);
  if (b.dataset.act) return doAction(b.dataset.act);
  if (b.dataset.opt !== undefined) return chooseOption(+b.dataset.opt);
  if (b.id === "startBtn") return startGame(S.lang);
  if (b.id === "introLang") return setLang(S.lang === "th" ? "en" : "th");
  if (b.id === "restartBtn") return startGame(S.lang);
});
document.addEventListener("keydown", ev => {
  if (ev.code === "Space" && ev.target.tagName !== "TEXTAREA" && UIM.screen === "game" && $("veil").hidden && S.started && !S.over && !S.event){ ev.preventDefault(); setSpeed(S.speed === 0 ? 1 : 0); }
  if (ev.code === "Escape" && S.tab){ S.tab = null; render(); }
});
document.addEventListener("fullscreenchange", () => render());
window.addEventListener("resize", () => { drawStripes(); if (S.tab === "stats") drawCharts(); if (S.tab === "tech") render(); });

/* ---------------------------- Boot ---------------------------- */
/* Loader: fonts → three.js → audio → tutorial images, then a tap to enter (unlocks audio). */
const THREE_URL = "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js";
function loadScript(src){ return new Promise(res => { const s = document.createElement("script"); s.src = src; s.onload = () => res(true); s.onerror = () => res(false); document.head.appendChild(s); setTimeout(() => res(false), 15000); }); }
function loadImg(src){ return new Promise(res => { const im = new Image(); im.onload = () => res(true); im.onerror = () => res(false); im.src = src; }); }
async function preloadAll(){
  const total = 2 + SFX.count() + TUT.length; let done = 0;
  const step = label => { done++; const p = Math.round(done / total * 100); $("ldFill").style.width = p + "%"; $("ldPct").textContent = p + "%"; if (label) $("ldLabel").textContent = `${t("loading")} · ${label}`; };
  $("ldLabel").textContent = `${t("loading")} · ${t("ldFonts")}`;
  await Promise.race([document.fonts ? document.fonts.ready : Promise.resolve(), new Promise(r => setTimeout(r, 4000))]); step(t("ldGlobe"));
  await loadScript(THREE_URL); step(t("ldAudio"));
  Globe.init();
  await Promise.all([SFX.preload(() => step(t("ldAudio"))), ...TUT.map(x => loadImg(`assets/tutorial/${x.img}`).then(() => step(t("ldImg"))))]);
  $("ldLabel").textContent = t("ldReady");
  let returning = false; try { returning = localStorage.getItem("p2050-entered") === "1"; } catch(e) {}
  if (returning){ $("loader").hidden = true; return; }        // audio starts on the first tap anywhere
  const btn = $("enterBtn"); btn.textContent = t("enter"); btn.hidden = false;
}
function boot(){
  let lang = "th"; try { lang = localStorage.getItem("p2050-lang") || "th"; } catch(e) {}
  S = newState(lang);
  render(); renderMenu();
  $("enterBtn").addEventListener("click", () => { SFX.unlock(); SFX.play("start"); $("loader").hidden = true; try { localStorage.setItem("p2050-entered", "1"); } catch(e) {} }, {once:true});
  const firstTap = () => SFX.unlock();                       // browsers only allow sound after a user gesture
  document.addEventListener("pointerdown", firstTap, {once:true}); document.addEventListener("keydown", firstTap, {once:true});
  preloadAll();
}
boot();
</script>
